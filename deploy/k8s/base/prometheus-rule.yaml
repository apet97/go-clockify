apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clockify-mcp
  namespace: clockify-mcp
  labels:
    app.kubernetes.io/name: clockify-mcp
    prometheus: operator
    role: alert-rules
spec:
  groups:
    - name: clockify-mcp.slo
      interval: 30s
      rules:
        # Multi-window multi-burn-rate alerts for the 99.9% SLO on
        # (tool_error|timeout) as a fraction of non-policy-denied calls.
        - alert: ClockifyMCPFastBurn
          expr: |
            (
              sum(rate(clockify_mcp_tool_calls_total{outcome=~"tool_error|timeout"}[5m]))
              /
              sum(rate(clockify_mcp_tool_calls_total{outcome!="policy_denied"}[5m]))
            ) > (14.4 * 0.001)
            and
            (
              sum(rate(clockify_mcp_tool_calls_total{outcome=~"tool_error|timeout"}[1h]))
              /
              sum(rate(clockify_mcp_tool_calls_total{outcome!="policy_denied"}[1h]))
            ) > (14.4 * 0.001)
          for: 2m
          labels:
            severity: critical
            slo: clockify-mcp-99_9
          annotations:
            summary: clockify-mcp fast-burn — 1h error budget exhaustion trajectory
            description: Error rate is burning through the 99.9% SLO budget at 14.4x allowed rate.

        - alert: ClockifyMCPSlowBurn
          expr: |
            (
              sum(rate(clockify_mcp_tool_calls_total{outcome=~"tool_error|timeout"}[30m]))
              /
              sum(rate(clockify_mcp_tool_calls_total{outcome!="policy_denied"}[30m]))
            ) > (6 * 0.001)
            and
            (
              sum(rate(clockify_mcp_tool_calls_total{outcome=~"tool_error|timeout"}[6h]))
              /
              sum(rate(clockify_mcp_tool_calls_total{outcome!="policy_denied"}[6h]))
            ) > (6 * 0.001)
          for: 15m
          labels:
            severity: warning
            slo: clockify-mcp-99_9
          annotations:
            summary: clockify-mcp slow-burn — 6h error budget exhaustion trajectory
            description: Error rate is burning through the 99.9% SLO budget at 6x allowed rate.

    - name: clockify-mcp.errors
      interval: 30s
      rules:
        - alert: ClockifyMCPHighToolErrorRate
          expr: |
            sum(rate(clockify_mcp_tool_calls_total{outcome=~"tool_error|timeout"}[5m]))
            /
            sum(rate(clockify_mcp_tool_calls_total{outcome!="policy_denied"}[5m]))
            > 0.01
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: clockify-mcp tool error rate >1% for 10m

        - alert: ClockifyMCPUpstreamUnavailable
          expr: |
            sum(rate(clockify_upstream_requests_total{status=~"5xx|error"}[5m])) > 0.5
            and
            sum(rate(clockify_upstream_requests_total{status="2xx"}[5m])) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: clockify-mcp cannot reach upstream Clockify API
            description: Every upstream Clockify request in the last 5m errored or returned 5xx.

        - alert: ClockifyMCPRateLimitSaturation
          expr: |
            sum(rate(clockify_mcp_rate_limit_rejections_total[5m]))
            /
            sum(rate(clockify_mcp_tool_calls_total[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: clockify-mcp rate-limit rejection ratio >5% for 5m

        - alert: ClockifyMCPHTTPAdmissionRejections
          expr: |
            sum by (path, reason) (rate(clockify_mcp_http_admission_rejections_total[5m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: clockify-mcp HTTP admission limiter rejecting requests
            description: The app-layer HTTP admission guard is rejecting {{ $labels.reason }} traffic on {{ $labels.path }}.

        - alert: ClockifyMCPHighLatency
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(clockify_mcp_tool_call_duration_seconds_bucket[10m]))
            ) > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: clockify-mcp p99 tool latency >10s for 10m

        - alert: ClockifyMCPNotReady
          expr: clockify_mcp_ready_state == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: clockify-mcp readiness probe failing

        - alert: ClockifyMCPAuthFailures
          expr: |
            sum(rate(clockify_mcp_http_requests_total{status="401"}[5m])) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: clockify-mcp 401 rate elevated

        - alert: ClockifyMCPAuditFailure
          expr: sum by (reason, phase) (rate(clockify_mcp_audit_failures_total[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: clockify-mcp audit persistence failure
            description: Audit persistence is failing; inspect docs/runbooks/audit-durability.md before continuing hosted traffic.

        - alert: ClockifyMCPAuditOutcomeNotDurable
          expr: |
            sum(rate(clockify_mcp_audit_failures_total{reason="persist_error",phase="outcome"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: clockify-mcp audit outcome row not durable
            description: A mutation completed but the post-handler audit outcome row was not durable. Inspect docs/runbooks/audit-durability.md before continuing hosted traffic.

        - alert: ClockifyMCPStreamableEventsAliasUse
          expr: sum(increase(clockify_mcp_streamable_events_alias_requests_total[30m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: legacy /mcp/events streamable HTTP alias is in use
            description: Clients are still using GET /mcp/events. Migrate them to the canonical GET /mcp SSE stream before retiring the alias.
