version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    revive:
      # Only the three rules the 2026-05-26 audit (T3.2) called for.
      # We opt OUT of revive's default ruleset so noisier checks like
      # `package-comments` don't fire — those have their own opinions
      # we may want to enable later, but not as part of T3.2.
      enable-all-rules: false
      rules:
        - name: exported
        - name: var-naming
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # Test fixtures commonly have unused handler params (e.g.
      # http.HandlerFunc that ignores the request, or testing.T helpers
      # taking an unused *testing.T). Renaming to `_` adds churn
      # without buying anything; enforce unused-parameter in
      # production code only.
      - path: _test\.go
        text: unused-parameter
        linters:
          - revive
      # T3.2 (2026-05-26 audit) enables `exported` to nudge every new
      # exported symbol to ship with godoc. The campaign started as a
      # blanket repo-wide silencer; the 2026-05-29 godoc track converts
      # that into per-package opt-outs so each package enforces
      # `exported` the moment it reaches full coverage. Already-clean
      # packages (paths, timeparse, jsonschema, tracing, logging,
      # dryrun, jsonmergepatch, config) have no entry and the rule
      # fires there. The remaining six packages keep their opt-out
      # below; remove each row as that package gets documented.
      # internal/resolve historical names (ResolveProjectID, ResolveClientID,
      # ResolveTagID, ResolveUserID, ResolveTaskID) all stutter as
      # `resolve.Resolve*ID` from callers. Renaming would break every
      # call site across internal/tools (~60+ call sites). The names
      # are intentional and stay; suppress only the stutter warning
      # for this package while keeping `exported` (godoc) enforcement.
      - path: internal/resolve/
        text: 'and that stutters'
        linters:
          - revive
      - path: internal/mcp/
        text: '^exported: '
        linters:
          - revive
      - path: internal/clockify/
        text: '^exported: '
        linters:
          - revive
      - path: internal/tools/
        text: '^exported: '
        linters:
          - revive
