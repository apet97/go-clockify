version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    revive:
      # Only the three rules the 2026-05-26 audit (T3.2) called for.
      # We opt OUT of revive's default ruleset so noisier checks like
      # `package-comments` don't fire — those have their own opinions
      # we may want to enable later, but not as part of T3.2.
      enable-all-rules: false
      rules:
        - name: exported
        - name: var-naming
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # Test fixtures commonly have unused handler params (e.g.
      # http.HandlerFunc that ignores the request, or testing.T helpers
      # taking an unused *testing.T). Renaming to `_` adds churn
      # without buying anything; enforce unused-parameter in
      # production code only.
      - path: _test\.go
        text: unused-parameter
        linters:
          - revive
      # T3.2 (2026-05-26 audit) enables `exported` to nudge every new
      # exported symbol to ship with godoc. The campaign started as a
      # blanket repo-wide silencer; the 2026-05-29 godoc track converted
      # that into per-package opt-outs so each package enforced
      # `exported` the moment it reached full coverage. The 2026-05-30
      # godoc phase-2 closed the last three packages
      # (internal/mcp, internal/clockify, internal/tools), so the
      # `exported` rule now fires across every Go package with no
      # per-package opt-outs. (internal/benchdata is a data-only
      # directory with no Go source, so it is not in scope.)
