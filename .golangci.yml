version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    revive:
      # Only the three rules the 2026-05-26 audit (T3.2) called for.
      # We opt OUT of revive's default ruleset so noisier checks like
      # `package-comments` don't fire — those have their own opinions
      # we may want to enable later, but not as part of T3.2.
      enable-all-rules: false
      rules:
        - name: exported
        - name: var-naming
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # Test fixtures commonly have unused handler params (e.g.
      # http.HandlerFunc that ignores the request, or testing.T helpers
      # taking an unused *testing.T). Renaming to `_` adds churn
      # without buying anything; enforce unused-parameter in
      # production code only.
      - path: _test\.go
        text: unused-parameter
        linters:
          - revive
      # T3.2 (2026-05-26 audit) enables `exported` to nudge every new
      # exported symbol to ship with godoc. There are ~813 pre-existing
      # exported symbols across internal/ that pre-date this rule and
      # have no godoc; treating each as a build break would block
      # progress, so the rule is set up but `exported` violations are
      # silenced repo-wide until the godoc-coverage campaign lands as
      # a follow-up. Remove this exclusion once every internal package
      # has its exported surface documented (track progress in the
      # audit doc).
      - text: '^exported: '
        linters:
          - revive
