extends:
- recommended

rules:
  # Truth ledger entries intentionally keep LIVE-OVERRIDE operations non-2xx
  # when live probes prove the source-covered route is absent or rejected.
  operation-2xx-response: off
  # Clockify has source-covered static/dynamic route families that Redocly's
  # generic path ambiguity rule cannot distinguish.
  no-ambiguous-paths: off
