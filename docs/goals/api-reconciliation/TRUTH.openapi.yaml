openapi: 3.0.3
info:
  title: Clockify Unified OpenAPI
  description: |
    Adversarially reconciled from three sources: official Clockify OpenAPI,
    GOCLMCP generated OpenAPI, and live probes against the sacrificial workspace.
    Only LIVE-VERIFIED or LIVE-OVERRIDE entries have receipts. Trust nothing else.

    PATH-PREFIX NOTE: The official spec embeds /v1/ in every path (no server URL defined).
    Our spec uses https://api.clockify.me/api/v1 as base with paths without /v1/ prefix.
    Both resolve to identical full URLs. All paths here use the non-prefixed form (our style).

    HOST NOTE: Clockify splits its API across multiple subdomains. The default `main`
    server (api.clockify.me/api/v1) hosts most resources. The shared-reports family
    lives on a separate `reports` server (reports.api.clockify.me/v1) — see per-path
    `servers:` overrides below. Subdomains like time-off.api.clockify.me and
    invoice.api.clockify.me return the SPA HTML (not API) and are NOT API hosts.
  version: '2026-05-21'
  license:
    name: Clockify Terms of Service
    url: https://clockify.me/terms

servers:
- url: https://api.clockify.me/api/v1
  description: Main Clockify REST API host (default for all paths unless overridden)
- url: https://reports.api.clockify.me/v1
  description: Reports/shared-reports API host (used by /shared-reports* via per-path override)

paths:
  /user:
    get:
      summary: Get currently logged-in user's info
      operationId: getUser
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260520-204725-get.user-happy-path.json
      - PROBE-LOG/20260520-204725-get.user-wrong-type.json
      - PROBE-LOG/20260520-204725-get.user-memberships-true.json
      x-reconciled-at: "20260520-204725"
      parameters:
      - name: include-memberships
        in: query
        required: false
        schema:
          type: boolean
        description: When true, populates memberships array (PROJECT/WORKSPACE/USERGROUP types). Default omits
          memberships.
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  activeWorkspace:
                    type: string
                  defaultWorkspace:
                    type: string
                  status:
                    type: string
                    enum: [ACTIVE, INACTIVE]
                  profilePicture:
                    type: string
                  customFields:
                    type: array
                    items:
                      type: object
                  memberships:
                    type: array
                    description: Empty unless include-memberships=true
                    items:
                      type: object
                      properties:
                        membershipType:
                          type: string
                          enum: [PROJECT, WORKSPACE, USERGROUP]
                        membershipStatus:
                          type: string
                        targetId:
                          type: string
                        userId:
                          type: string
                        hourlyRate:
                          type: object
                          nullable: true
                        costRate:
                          type: object
                          nullable: true
                  settings:
                    type: object
        '400':
          description: Invalid query parameter type (Spring MVC validation - includes Java type names in error message)

  /workspaces/{workspaceId}:
    get:
      summary: Get workspace by ID
      operationId: getWorkspace
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260520-204725-get.workspaces-happy-path.json
      x-reconciled-at: "20260520-204725"
      x-notes: "cakeOrganizationId and featureSubscriptionType are internal Clockify fields not in official spec."
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
        '200':
          description: Workspace object
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  cakeOrganizationId:
                    type: string
                    description: Internal Clockify org ID (not in official spec)
                  featureSubscriptionType:
                    type: string
                    description: Internal subscription tier (e.g. BUNDLE_YEAR_2024)
                  features:
                    type: array
                    items:
                      type: string
                  currencies:
                    type: array
                    items:
                      type: object
                  hourlyRate:
                    type: object
                  costRate:
                    type: object
                  memberships:
                    type: array
                    items:
                      type: object
                  workspaceSettings:
                    type: object
                  subdomain:
                    type: object
                  imageUrl:
                    type: string
    put:
      operationId: updateWorkspace
      summary: Update workspace (PHANTOM — PUT not bound on api.clockify.me)
      x-verification-status: LIVE-OVERRIDE
      x-evidence:
      - PROBE-LOG/20260521-040000-put.workspaces-code-analysis.json
      x-notes: |
        PUT /workspaces/{workspaceId} returns 405 'Request method PUT is not supported'
        (error code 3000). Official spec documents only GET at this path. Our spec
        documents PUT but explicitly marks it as NOT BOUND on api.clockify.me with 405
        live evidence. MCP clockify_workspace_settings uses GET only. Phantom endpoint.
      x-truth-iter: iter20
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '405':
          description: PUT method not supported (405 from live) — path is absent or not registered for PUT on
            api.clockify.me


  /workspaces/{workspaceId}/clients:
    get:
      summary: List clients in workspace
      operationId: getClients
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260520-204725-get.workspaces.clients-happy-path.json
      - PROBE-LOG/20260520-204725-get.workspaces.clients-empty-list.json
      - PROBE-LOG/20260520-204725-get.workspaces.clients-pagination.json
      x-reconciled-at: "20260520-204725"
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Filter by name (substring or exact match)
      - name: sort-column
        in: query
        required: false
        schema:
          type: string
      - name: sort-order
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page-size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          maximum: 200
        description: Clockify accepts up to 200. Hyphenated param name (page-size not pageSize).
      responses:
        '400':
          description: Bad Request
        '200':
          description: Array of client objects (bare array, not wrapped object)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    workspaceId:
                      type: string
                    archived:
                      type: boolean
                    address:
                      type: string
                      nullable: true
                    email:
                      type: string
                      nullable: true
                    note:
                      type: string
                      nullable: true
                    ccEmails:
                      nullable: true
                      type: array
                      items:
                        type: string
                    currencyCode:
                      type: string
                    currencyId:
                      type: string
          x-empty-shape: "[] (bare array, not {items:[]})"


    post:
      operationId: createClient
      summary: Create a client in the workspace
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260521-020000-post.workspaces.clients-happy-path.json
      x-notes: |
        Client created (id <redacted-id:1daad9ff7a>) and immediately deleted.
        Response shape: id, name, currencyCode, currencyId, workspaceId.
      x-truth-iter: iter18
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
      responses:
        '400':
          description: Bad Request
        '200':
          description: Client created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  currencyCode:
                    type: string
                  currencyId:
                    type: string
                  workspaceId:
                    type: string
  /workspaces/{workspaceId}/addons/{addonId}/webhooks:
    get:
      summary: Get webhooks for addon on workspace
      operationId: getAddonWebhooks
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260520-204725-get.workspaces.addons.webhooks-happy-path.json
      - PROBE-LOG/20260520-204725-get.workspaces.addons.webhooks-wrong-type.json
      x-reconciled-at: "20260520-204725"
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: addonId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9a-f]{24}$'
        description: Must be 24-char hex MongoDB ObjectId. Server returns 400 with "hexString has 24 characters" if
          invalid.
      responses:
        '200':
          description: Webhooks object (NOT an array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      type: object
                  workspaceWebhookCount:
                    type: integer
                    description: Total workspace webhook count
          x-empty-shape: "{webhooks:[], workspaceWebhookCount:0} when no webhooks (not 404)"
        '400':
          description: addonId is not a valid 24-char hex MongoDB ObjectId

  /shared-reports/{id}:
    servers:
    - url: https://reports.api.clockify.me/v1
      description: Reports host (does NOT use the main api.clockify.me host)
    get:
      summary: Get shared report by ID
      operationId: getSharedReport
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260520-204725-get.shared-reports-fence-blocked.json
      - PROBE-LOG/20260521-021234-get.shared-reports-by-id-reports-host.json
      - PROBE-LOG/20260521T023021Z-codex-shared-reports-get-by-id-reports-host.json
      - PROBE-LOG/20260521T023021Z-codex-shared-reports-get-workspace-scoped-405.json
      x-truth-iter: iter24-post-completion
      x-notes: |
        Promoted from UNRESOLVED-NO-LIVE after direct curl confirmed the route on
        the reports.api.clockify.me host (the path is absent on api.clockify.me —
        Sonnet's iter4 probe was on the wrong host). Path is NOT workspace-scoped.
        Response shape varies by report type and exportType; SUMMARY+JSON returns
        {totals, donutChart, groupTotals, groupOne, filters{...full report meta}}.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: exportType
        in: query
        required: false
        schema:
          type: string
          enum: [JSON, CSV, PDF, XLSX]
      - name: dateRangeStart
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: dateRangeEnd
        in: query
        required: false
        schema: {type: string, format: date-time}
      - name: page
        in: query
        required: false
        schema: {type: integer, default: 1}
      - name: pageSize
        in: query
        required: false
        schema: {type: integer, default: 20}
      - name: sortOrder
        in: query
        required: false
        schema: {type: string, enum: [ASCENDING, DESCENDING]}
      - name: sortColumn
        in: query
        required: false
        schema: {type: string}
      responses:
        '400':
          description: Bad Request
        '200':
          description: Shared report data (shape depends on report type + exportType)
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: array
                    items: {type: object}
                  donutChart:
                    type: array
                    items: {type: object}
                  groupTotals:
                    type: object
                  groupOne:
                    type: array
                    items: {type: object}
                  filters:
                    type: object
                    description: Full saved report metadata (id, name, workspaceId, type, filter, etc.)

  /workspaces/{workspaceId}/approval-requests:
    get:
      summary: List approval requests for workspace
      operationId: getApprovalRequests
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260520-210956-get.workspaces.approval-requests-happy-path.json
      x-reconciled-at: "20260520-210956"
      x-notes: "Response is a bare array of rich approval-period objects. Each item contains approvalRequest metadata PLUS
        inline entries and expenses arrays (heavy payload). time values are ISO 8601 duration strings. money in minor units."
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page-size
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '400':
          description: Bad Request
        '200':
          description: Array of approval-period objects (bare array)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    approvalRequest:
                      type: object
                      properties:
                        creator:
                          type: object
                          properties:
                            userEmail:
                              type: string
                            userId:
                              type: string
                            userName:
                              type: string
                        dateRange:
                          type: object
                          properties:
                            end:
                              type: string
                            start:
                              type: string
                        id:
                          type: string
                        owner:
                          type: object
                          properties:
                            startOfWeek:
                              type: string
                            timeZone:
                              type: string
                            userId:
                              type: string
                            userName:
                              type: string
                        status:
                          type: object
                          properties:
                            note:
                              type: string
                            state:
                              type: string
                              enum: [PENDING, APPROVED, WITHDRAWN_APPROVAL]
                            updatedAt:
                              type: string
                            updatedBy:
                              type: string
                            updatedByUserName:
                              type: string
                        workspaceId:
                          type: string
                    approvedTime:
                      type: string
                      description: ISO 8601 duration
                    billableAmount:
                      type: integer
                      description: Minor units (cents)
                    billableTime:
                      type: string
                      description: ISO 8601 duration
                    breakTime:
                      type: string
                      description: ISO 8601 duration
                    costAmount:
                      type: number
                    entries:
                      type: array
                      description: Full time entry objects (heavy)
                      items:
                        type: object
                    expenseTotal:
                      type: integer
                      description: Minor units (cents)
                    expenses:
                      type: array
                      items:
                        type: object
                    pendingTime:
                      type: string
                      description: ISO 8601 duration
                    trackedTime:
                      type: string
                      description: ISO 8601 duration

    post:
      operationId: post.workspaces.approval-requests
      summary: Submit timesheet entries for approval
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260521-010000-post.workspaces.approval-requests-dry-run.json
      x-notes: "LIVE-VERIFIED: clockify_approvals_submit uses POST /workspaces/{wId}/approval-requests via postApprovalPeriod()
        in approvals.go:167. dry_run probe returned ok:true. GET on this path returns 200 (list endpoint). Both specs agree.
        Note: GET on this path returns a list of approval requests."
      x-truth-iter: iter17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: string
                  description: Approval period type (e.g. WEEKLY)
                periodStart:
                  type: string
                  description: Start of the period (RFC3339)
      responses:
        '400':
          description: Bad Request
        "200":
          description: Approval request submitted
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
  /workspaces/{workspaceId}/custom-fields:
    get:
      summary: List custom fields for workspace
      operationId: getCustomFields
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260520-210956-get.workspaces.custom-fields-happy-path.json
      x-reconciled-at: "20260520-210956"
      x-notes: "Server ignores page-size — returns all items regardless. Official spec documents name/status/entity-type filter
        params not confirmed live. Our spec missing filter params."
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: Filter by name (from official spec; not live-verified)
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [ACTIVE, INACTIVE, VISIBLE]
        description: Filter by status (from official spec; not live-verified)
      - name: entity-type
        in: query
        required: false
        schema:
          type: string
        description: Filter by entity type (from official spec; not live-verified)
      responses:
        '400':
          description: Bad Request
        '200':
          description: Array of custom field objects (bare array; page-size ignored — all returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    allowedValues:
                      type: array
                      items:
                        type: string
                      description: Non-empty for DROPDOWN_SINGLE type
                    description:
                      type: string
                      nullable: true
                    entityType:
                      type: string
                      enum: [TIMEENTRY]
                    id:
                      type: string
                    name:
                      type: string
                    onlyAdminCanEdit:
                      type: boolean
                    placeholder:
                      type: string
                    projectDefaultValues:
                      type: array
                      items:
                        type: object
                        properties:
                          projectId:
                            type: string
                          status:
                            type: string
                          value:
                            nullable: true
                            type: string
                    required:
                      type: boolean
                    status:
                      type: string
                      enum: [ACTIVE, INACTIVE, VISIBLE]
                    type:
                      type: string
                      enum: [TXT, NUMBER, DROPDOWN_SINGLE, CHECKBOX]
                    workspaceDefaultValue:
                      nullable: true
                      type: string
                    workspaceId:
                      type: string


    post:
      operationId: createCustomField
      summary: Create a custom field in the workspace
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260521-020000-post.workspaces.custom-fields-happy-path.json
      x-notes: |
        TXT field created (id <redacted-id:1a8c9d0b44>) and deleted. entityType defaults to
        TIMEENTRY. status defaults to VISIBLE. allowedValues is empty for TXT type.
      x-truth-iter: iter18
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - field_type
              properties:
                name:
                  type: string
                field_type:
                  type: string
                  enum: [TXT, NUMBER, DROPDOWN_SINGLE, DROPDOWN_MULTIPLE, CHECKBOX, LINK]
                required:
                  type: boolean
                status:
                  type: string
                  enum: [VISIBLE, INVISIBLE, INACTIVE]
                  default: VISIBLE
      responses:
        '400':
          description: Bad Request
        '200':
          description: Custom field created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  type:
                    type: string
                  entityType:
                    type: string
                    description: Defaults to TIMEENTRY
                  status:
                    type: string
                  allowedValues:
                    type: array
                    items:
                      type: string
                  workspaceId:
                    type: string
  /workspaces/{workspaceId}/holidays:
    get:
      summary: List holidays for workspace
      operationId: getHolidays
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260520-210956-get.workspaces.holidays-happy-path.json
      x-reconciled-at: "20260520-210956"
      x-notes: "Server ignores page-size — returns all items. Date fields use YYYY-MM-DD strings (not ISO 8601 datetime).
        userGroupIds array can be very large (100+)."
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
        '200':
          description: Array of holiday objects (bare array; pagination appears unsupported)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    automaticTimeEntryCreation:
                      type: boolean
                    datePeriod:
                      type: object
                      properties:
                        endDate:
                          type: string
                          description: "YYYY-MM-DD format (not ISO 8601)"
                        startDate:
                          type: string
                          description: "YYYY-MM-DD format (not ISO 8601)"
                    everyoneIncludingNew:
                      type: boolean
                    id:
                      type: string
                    name:
                      type: string
                    occursAnnually:
                      type: boolean
                    projectId:
                      type: string
                      nullable: true
                    taskId:
                      type: string
                      nullable: true
                    userGroupIds:
                      type: array
                      items:
                        type: string
                    userIds:
                      type: array
                      items:
                        type: string
                    workspaceId:
                      type: string


    post:
      operationId: createHoliday
      summary: Create a new holiday in the workspace
      x-verification-status: LIVE-VERIFIED
      x-evidence:
      - PROBE-LOG/20260521-020000-post.workspaces.holidays-happy-path.json
      x-notes: |
        Actual create + delete. dry_run not supported. Response has date_period:{start_date,end_date}
        object shape. Requires name + start_date.
      x-truth-iter: iter18
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - start_date
              properties:
                name:
                  type: string
                start_date:
                  type: string
                end_date:
                  type: string
                occurs_annually:
                  type: boolean
                user_ids:
                  type: array
                  items:
                    type: string
      responses:
        '400':
          description: Bad Request
        '200':
          description: Holiday created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  workspaceId:
                    type: string
                  date_period:
                    type: object
                    properties:
                      start_date:
                        type: string
                      end_date:
                        type: string
                  occursAnnually:
                    type: boolean
  /workspaces/{workspaceId}/expenses:
    get:
      summary: List expenses for workspace
      operationId: getExpenses
      x-verification-status: LIVE-OVERRIDE
      x-evidence:
      - PROBE-LOG/20260520-210956-get.workspaces.expenses-happy-path.json
      x-reconciled-at: "20260520-210956"
      x-notes: "CRITICAL: response is NOT a bare array. It is {dailyTotals, expenses:{count, expenses:[]}, weeklyTotals}.
        Both specs likely wrong. List items use nested category/project/task objects. Pagination via page/page-size works."
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page-size
        in: query
        required: false
        schema:
          type: integer
          default: 50
      responses:
        '400':
          description: Bad Request
        '200':
          description: Expense list wrapper object (NOT a bare array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  dailyTotals:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: "YYYY-MM-DD"
                        dateAsInstant:
                          type: string
                        total:
                          type: integer
                          description: Minor units (cents)
                  expenses:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Total expense count
                      expenses:
                        type: array
                        items:
                          type: object
                          properties:
                            billable:
                              type: boolean
                            category:
                              type: object
                              properties:
                                archived:
                                  type: boolean
                                hasUnitPrice:
