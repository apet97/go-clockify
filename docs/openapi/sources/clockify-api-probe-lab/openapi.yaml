  # ===========================================================================
  # SHARED REPORTS (host: reports.api.clockify.me, no /api/ prefix)
  # ===========================================================================

  /workspaces/{workspaceId}/shared-reports:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    servers: [{ url: "https://reports.api.clockify.me/v1" }]
    get:
      tags: [SharedReport]
      summary: List shared reports
      description: |
        VERIFIED LIVE: uses `pageSize` (camelCase). Hyphenated
        `page-size` is silently ignored. Response envelope is
        `{reports:[], count}`.
      parameters:
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeCamel" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedReportListEnvelope" }
    post:
      tags: [SharedReport]
      summary: Create shared report
      description: |
        Body uses `type` (not `reportType`) and `filter` (singular,
        not `filters`). Required nested keys:
        `filter.exportType`, `filter.dateRangeStart`, `filter.dateRangeEnd`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedReportCreate" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedReport" }

  /shared-reports/{sharedReportId}:
    servers: [{ url: "https://reports.api.clockify.me/v1" }]
    parameters: [{ $ref: "#/components/parameters/SharedReportId" }]
    get:
      tags: [SharedReport]
      summary: Public/bare GET of a shared report or export
      description: |
        Bare path (no workspace segment). Pass `?exportType=PDF|CSV|XLSX|JSON_V1`
        to receive a binary export with `Content-Disposition` filename. Without
        `exportType`, returns the shared-report JSON envelope.
      parameters:
        - name: exportType
          in: query
          schema: { type: string, enum: [JSON_V1, JSON, CSV, XLSX, PDF] }
      responses:
        '200':
          description: OK — JSON envelope when `exportType` omitted; binary export otherwise.
          content:
            application/json: { schema: { $ref: "#/components/schemas/SharedReport" } }
            application/pdf:  { schema: { type: string, format: binary } }
            text/csv:         { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /workspaces/{workspaceId}/shared-reports/{sharedReportId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/SharedReportId" }
    servers: [{ url: "https://reports.api.clockify.me/v1" }]
    put:
      tags: [SharedReport]
      summary: Update shared report (merge semantics)
      description: |
        Workspace-prefixed PUT works (bare-id PUT/PATCH return 405).
        Body uses `type` and `filter` (per create). PUT is MERGE — sending
        `{name}` alone preserves the existing filter.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharedReportCreate" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedReport" }
    delete:
      tags: [SharedReport]
      summary: Delete shared report
      responses: { '204': { description: Deleted } }

  # ===========================================================================
  # APPROVALS — additional endpoints (verified live)
  # ===========================================================================

  /workspaces/{workspaceId}/approval-requests/users/{userId}/resubmit-entries-for-approval:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [Approval]
      summary: Resubmit time entries for approval after rejection
      description: |
        Verified: requires the workspace's pinned approval period in the body
        (start/end). State-machine 4006 enforced — the targeted request must
        be in REJECTED state. Returns the refreshed approval request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dateRangeStart, dateRangeEnd]
              properties:
                dateRangeStart: { type: string, format: date-time }
                dateRangeEnd:   { type: string, format: date-time }
      responses:
        '200': { description: OK }
        '400':
          description: "code:4006 if approval state-machine forbids this transition"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockifyError" }

