      responses: { '200': { description: OK } }

  # ===========================================================================
  # APPROVAL
  # ===========================================================================

  /workspaces/{workspaceId}/approval-requests:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Approval]
      summary: List approval requests (admin view)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, WITHDRAWN_SUBMISSION, REJECTED, WITHDRAWN_APPROVAL] } }
        - { name: sort-column, in: query, schema: { type: string } }
        - { name: sort-order, in: query, schema: { type: string, enum: [ASCENDING, DESCENDING] } }
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeHyphen" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Approval" } }

  /workspaces/{workspaceId}/approval-requests/users/{userId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [Approval]
      summary: Submit timesheet for approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dateRange]
              properties:
                dateRange: { $ref: "#/components/schemas/DateTimeInterval" }
                status:    { type: object, properties: { note: { type: string } } }
      responses: { '201': { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } } }

  /workspaces/{workspaceId}/approval-requests/{approvalId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/ApprovalId" }
    patch:
      tags: [Approval]
      summary: Update approval status (approve/reject/withdraw)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: object
                  properties:
                    state: { type: string, enum: [APPROVED, REJECTED, WITHDRAWN_SUBMISSION, WITHDRAWN_APPROVAL, PENDING] }
                    note:  { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }

  # ===========================================================================
  # TIME OFF
  # ===========================================================================

  /workspaces/{workspaceId}/policies:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Policy]
      summary: List time-off policies
      parameters:
        - { name: archived, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeHyphen" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimeOffPolicy" } }
    post:
      tags: [Policy]
      summary: Create time-off policy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeOffPolicy" }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TimeOffPolicy" } } } } }

  /workspaces/{workspaceId}/policies/{policyId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/PolicyId" }
    get:
      tags: [Policy]
      summary: Get policy
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TimeOffPolicy" } } } } }
    put:
      tags: [Policy]
      summary: Update policy
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TimeOffPolicy" } } } }
      responses: { '200': { description: OK } }
    delete:
      tags: [Policy]
      summary: Delete (archive) policy
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/policies/{policyId}/archive:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/PolicyId" }
    patch:
      tags: [Policy]
      summary: Archive / unarchive policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { archived: { type: boolean } }
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/balance:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Balance]
      summary: Get balances (admin)
      parameters:
        - { name: policyId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeHyphen" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Balance" } }
    patch:
      tags: [Balance]
      summary: Adjust user balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:   { type: string }
                policyId: { type: string }
                amount:   { type: number }
                note:     { type: string }
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/time-off/requests:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [TimeOff]
      summary: List time-off requests (POST body required)
      description: |
        VERIFIED LIVE: this endpoint is POST, not GET. `Content-Type: application/json`. Empty body `{}` is accepted; response envelope is `{count, requests:[]}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:     { type: integer, default: 1 }
                pageSize: { type: integer, default: 50 }
                status:
                  type: object
                  properties:
                    statusType: { type: array, items: { type: string, enum: [PENDING, APPROVED, REJECTED, WITHDRAWN] } }
                users:    { type: object, additionalProperties: true }
                policies: { type: object, additionalProperties: true }
                start:    { type: string, format: date-time }
                end:      { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:    { type: integer }
                  requests: { type: array, items: { $ref: "#/components/schemas/TimeOffRequest" } }

  /workspaces/{workspaceId}/time-off/requests/{requestId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/RequestId" }
    get:
      tags: [TimeOff]
      summary: Get a time-off request
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeOffRequest" }
    delete:
      tags: [TimeOff]
      summary: Delete a time-off request
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/time-off/requests/users/{userId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [TimeOff]
      summary: Create time-off request for user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeOffRequestCreate" }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/TimeOffRequest" } } } } }

  /workspaces/{workspaceId}/time-off/requests/{requestId}/status:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/RequestId" }
    patch:
      tags: [TimeOff]
      summary: Update request status (approve/reject/withdraw)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statusType: { type: string, enum: [APPROVED, REJECTED, WITHDRAWN] }
                note:       { type: string }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TimeOffRequest" } } } } }

  # ===========================================================================
  # INVOICE
  # ===========================================================================

  /workspaces/{workspaceId}/invoices:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Invoice]
      summary: List invoices
      description: |
        VERIFIED LIVE: Envelope `{total, invoices:[]}`. `statuses` (plural,
        repeatable) is the correct filter; singular `status` is silently
        ignored.
      parameters:
        - { name: statuses, in: query, schema: { type: array, items: { type: string, enum: [UNSENT, SENT, PAID, VOID, PARTIALLY_PAID] } } }
        - { name: clients, in: query, schema: { type: array, items: { type: string } } }
        - { name: sort-column, in: query, schema: { type: string } }
        - { name: sort-order, in: query, schema: { type: string, enum: [ASCENDING, DESCENDING] } }
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeHyphen" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceListResponse" }
    post:
      tags: [Invoice]
      summary: Create invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, currency]
              properties:
                clientId: { type: string }
                currency: { $ref: "#/components/schemas/Currency" }
                number:   { type: string }
                issuedDate: { type: string, format: date }
                dueDate:    { type: string, format: date }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Invoice" } } } } }

  /workspaces/{workspaceId}/invoices/info:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [Invoice]
      summary: Invoice report (envelope query)
      description: |
        Filter by `statuses`, returns the same `{total, invoices}` envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statuses: { type: array, items: { type: string, enum: [UNSENT, SENT, PAID, VOID, PARTIALLY_PAID] } }
                clients:  { type: array, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceListResponse" }

  /workspaces/{workspaceId}/invoices/{invoiceId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/InvoiceId" }
    get:
      tags: [Invoice]
      summary: Get invoice (embeds `items` array; do NOT call separate /items endpoint — returns 405)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
    put:
      tags: [Invoice]
      summary: Update invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Invoice" }
      responses: { '200': { description: OK } }
    delete:
      tags: [Invoice]
      summary: Delete invoice
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/invoices/{invoiceId}/items:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/InvoiceId" }
    post:
      tags: [Invoice]
      summary: Add invoice line item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/InvoiceLineItem" }
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/invoices/{invoiceId}/payments:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/InvoiceId" }
    post:
      tags: [Invoice]
      summary: Record a payment against the invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:  { type: integer, description: "Minor units" }
                date:    { type: string, format: date }
                note:    { type: string }
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/invoices/{invoiceId}/status:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/InvoiceId" }
    patch:
      tags: [Invoice]
      summary: Change invoice status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { status: { type: string, enum: [UNSENT, SENT, PAID, VOID, PARTIALLY_PAID] } }
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/invoices/{invoiceId}/export:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/InvoiceId" }
    get:
      tags: [Invoice]
      summary: Export invoice as PDF
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf:
              schema: { type: string, format: binary }

  # ===========================================================================
  # EXPENSE
  # ===========================================================================

  /workspaces/{workspaceId}/expenses:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Expense]
      summary: List expenses
      description: VERIFIED LIVE — double-nested envelope (see `ExpenseListEnvelope`).
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: user, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: start, in: query, schema: { type: string, format: date-time } }
        - { name: end, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeHyphen" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseListEnvelope" }
    post:
      tags: [Expense]
      summary: Create expense (MULTIPART required)
      description: |
        VERIFIED LIVE: `application/json` returns 415. Required form fields:
        `userId`, `amount` (string, decimal in major units), `date`
        (ISO 8601 `yyyy-MM-ddTHH:mm:ssZ`), `categoryId`. `file` is
        documented required but server tolerates absence (response
        `fileId: ""`). `projectId` accepted as absent.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [userId, amount, date, categoryId]
              properties:
                userId:     { type: string }
                amount:     { type: string, example: "1.50" }
                date:       { type: string, format: date-time }
                categoryId: { type: string }
                notes:      { type: string }
                projectId:  { type: string }
                taskId:     { type: string }
                billable:   { type: boolean }
                file:       { type: string, format: binary }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }

  /workspaces/{workspaceId}/expenses/{expenseId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/ExpenseId" }
    get:
      tags: [Expense]
      summary: Get expense
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } } }
    put:
      tags: [Expense]
      summary: Update expense (multipart, with `changeFields`)
      description: |
        VERIFIED LIVE: multipart. Required `changeFields` array
        listing which fields to mutate. Valid values:
        `USER, DATE, PROJECT, TASK, CATEGORY, NOTES, AMOUNT, BILLABLE, FILE`.
        Omitting `changeFields` silently ignores changes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [changeFields]
              properties:
                changeFields:
                  type: array
                  items: { type: string, enum: [USER, DATE, PROJECT, TASK, CATEGORY, NOTES, AMOUNT, BILLABLE, FILE] }
                userId:     { type: string }
                date:       { type: string, format: date-time }
                projectId:  { type: string }
                taskId:     { type: string }
                categoryId: { type: string }
                notes:      { type: string }
                amount:     { type: string }
                billable:   { type: boolean }
                file:       { type: string, format: binary }
      responses: { '200': { description: OK } }
    delete:
      tags: [Expense]
      summary: Delete expense
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/expenses/categories:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Expense]
      summary: List expense categories
      description: |
        VERIFIED LIVE: returns `{count, categories:[]}` envelope, NOT
        a bare array.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:      { type: integer }
                  categories: { type: array, items: { $ref: "#/components/schemas/ExpenseCategory" } }
    post:
      tags: [Expense]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                unit:        { type: string }
                priceInCents: { type: integer }
                hasUnitPrice: { type: boolean }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCategory" } } } } }

  /workspaces/{workspaceId}/expenses/categories/{categoryId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/CategoryId" }
    put:
      tags: [Expense]
      summary: Update category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseCategory" }
      responses: { '200': { description: OK } }
    delete:
      tags: [Expense]
      summary: Delete category
      responses: { '200': { description: OK } }

  # ===========================================================================
  # WEBHOOK
  # ===========================================================================

  /workspaces/{workspaceId}/webhooks:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Webhook]
      summary: List user webhooks
      description: VERIFIED — envelope `{workspaceWebhookCount, webhooks:[]}`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookListEnvelope" }
    post:
      tags: [Webhook]
      summary: Create webhook
      description: |
        Register only against placeholder URLs (e.g. https://example.com/...)
        from probe contexts. Do NOT call `/test` on a created webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }

  /workspaces/{workspaceId}/webhooks/{webhookId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/WebhookId" }
    put:
      tags: [Webhook]
      summary: Update webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses: { '200': { description: OK } }
    delete:
      tags: [Webhook]
      summary: Delete webhook
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/webhooks/{webhookId}/generateNewToken:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/WebhookId" }
    patch:
      tags: [Webhook]
      summary: Regenerate the per-webhook HMAC token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }

  # ===========================================================================
  # SCHEDULING
  # ===========================================================================

  /workspaces/{workspaceId}/scheduling/assignments/all:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Scheduling]
      summary: List all assignments in a window
      description: |
        VERIFIED LIVE: path requires `/all` suffix and mandatory `start`
        + `end` query params (ISO 8601 with `Z`).
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end,   in: query, required: true, schema: { type: string, format: date-time } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: projectId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeCamel" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SchedulingAssignment" }

  /workspaces/{workspaceId}/scheduling/assignments:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [Scheduling]
      summary: Create scheduling assignment
      description: |
        For a single one-off assignment, use the recurring path with
        `repeat=false`, `weeks=1`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, projectId, period, hoursPerDay]
              properties:
                userId:      { type: string }
                projectId:   { type: string }
                taskId:      { type: string }
                period:      { $ref: "#/components/schemas/DateTimeInterval" }
                hoursPerDay: { type: number }
                note:        { type: string }
                billable:    { type: boolean }
                includeNonWorkingDays: { type: boolean }
                published:   { type: boolean, default: false, description: "Probes MUST keep published=false (draft) to avoid notifying other users." }
                repeat:      { type: boolean }
                weeks:       { type: integer }
                excludeDays:
                  type: array
                  items: { type: object, additionalProperties: true }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SchedulingAssignment" } } } } }

  /workspaces/{workspaceId}/scheduling/assignments/{assignmentId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/AssignmentId" }
    put:
      tags: [Scheduling]
      summary: Update assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchedulingAssignment" }
      responses: { '200': { description: OK } }
    delete:
      tags: [Scheduling]
      summary: Delete assignment
      responses: { '204': { description: Deleted } }

  /workspaces/{workspaceId}/scheduling/assignments/projects/totals:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    post:
      tags: [Scheduling]
      summary: Project totals over date window
      description: VERIFIED LIVE — note `/assignments/projects/totals` path segment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, end]
              properties:
                start:    { type: string, format: date-time }
                end:      { type: string, format: date-time }
                pageSize: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    workspaceId:    { type: string }
                    projectId:      { type: string }
                    projectName:    { type: string }
                    projectColor:   { type: string }
                    projectArchived: { type: boolean }
                    clientName:     { type: string, nullable: true }
                    totalHours:     { type: number }
                    assignments:
                      type: array
                      items:
                        type: object
                        properties:
                          date:          { type: string, format: date }
                          hasAssignment: { type: boolean }
