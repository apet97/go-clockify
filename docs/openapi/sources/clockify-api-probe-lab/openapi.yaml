openapi: 3.0.3
info:
  title: Clockify API — Probe-Verified Comprehensive Specification
  version: "2026-05-12"
  description: |
    Comprehensive OpenAPI 3.0.3 specification synthesised from live probes
    against workspace `<REDACTED_ID>` plus the public *DOC.md
    files in `clockify-api-probe-lab/`. Every operation listed has at
    least one source of evidence — either a captured fixture under
    `fixtures/<domain>/` or a cross-checked supplementary OpenAPI file
    (Invoiceopenapi.yaml, inveoice+Balance+Policies+TimeOff.yaml,
    openapi_scheduling.yaml, openapi_timeentry.yaml,
    openapi_usergroups_tags.yaml, USEREXPENCUSTOMFIED.yaml).

    Known verified deltas from the public docs are recorded inline in
    operation descriptions and schema descriptions. See `findings/`
    directory for narrative evidence and `findings/SUMMARY.md` for the
    prioritised go-clockify change list.

    Authentication
    --------------
    All operations use `X-Api-Key`. Add-on contexts use `X-Addon-Token`
    instead (separate JWT-bound flow). `Authorization: Bearer` is NOT
    accepted on the v1 surface.

    Host map
    --------
    - Default: https://api.clockify.me/api/v1
    - Reports (shared-reports + summary/detailed/weekly/attendance):
      https://reports.api.clockify.me/v1
    - Time-off requests and balance/policy endpoints live on the default
      host under `/workspaces/{ws}/time-off/...` and `/workspaces/{ws}/policies/...`.

servers:
  - url: https://api.clockify.me/api/v1
    description: Main Clockify API (default host for all operations except reports)
  - url: https://reports.api.clockify.me/v1
    description: Reports API host — for /workspaces/{ws}/reports/{summary,detailed,weekly,attendance} and /shared-reports

security:
  - ApiKeyAuth: []

tags:
  - { name: User,        description: "Current user, user list, role management" }
  - { name: Workspace,   description: "Workspaces and workspace settings" }
  - { name: Client,      description: "Workspace clients" }
  - { name: Project,     description: "Projects, memberships, estimates, rates" }
  - { name: Task,        description: "Project tasks" }
  - { name: Tag,         description: "Workspace tags" }
  - { name: TimeEntry,   description: "Time entries — log, edit, bulk update" }
  - { name: Group,       description: "User groups (teams)" }
  - { name: CustomField, description: "Workspace + project custom fields" }
  - { name: Holiday,     description: "Workspace holidays" }
  - { name: Approval,    description: "Timesheet approval requests" }
  - { name: TimeOff,     description: "Time-off requests + policies + balances" }
  - { name: Policy,      description: "Time-off policies" }
  - { name: Balance,     description: "Time-off balances" }
  - { name: Invoice,     description: "Invoices, line items, payments, settings" }
  - { name: Expense,     description: "Expenses + categories (multipart)" }
  - { name: Webhook,     description: "User-defined webhooks (do not invoke /test against prod)" }
  - { name: Scheduling,  description: "Scheduling assignments + capacity" }
  - { name: Report,      description: "Summary / Detailed / Weekly / Attendance reports" }
  - { name: SharedReport, description: "Shared reports (different host + path prefix)" }
  - { name: Attendance,  description: "Per-user attendance and time totals" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    AddonKeyAuth:
      type: apiKey
      in: header
      name: X-Addon-Token

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, example: <REDACTED_ID> }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    ClientId:
      name: clientId
      in: path
      required: true
      schema: { type: string }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    HolidayId:
      name: holidayId
      in: path
      required: true
      schema: { type: string }
    CustomFieldId:
      name: customFieldId
      in: path
      required: true
      schema: { type: string }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string }
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string }
    PolicyId:
      name: policyId
      in: path
      required: true
      schema: { type: string }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string }
    TimeEntryId:
      name: timeEntryId
      in: path
      required: true
      schema: { type: string }
    SharedReportId:
      name: sharedReportId
      in: path
      required: true
      schema: { type: string }
    PageQuery:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSizeHyphen:
      name: page-size
      in: query
      description: |
        Hyphenated `page-size` is the documented spelling for v1 listing
        endpoints. Note: shared-reports uses `pageSize` (camelCase); the
        hyphenated form is silently ignored there.
      schema: { type: integer, minimum: 1, default: 50 }
    PageSizeCamel:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, default: 50 }

  schemas:
    # ---------- shared enums ----------
    Currency:
      type: string
      description: ISO 4217 currency code
      example: EUR

    RateDto:
      type: object
      properties:
        amount:    { type: integer, description: "Rate in minor units (cents). e.g. 12000 = 120.00" }
        currency:  { $ref: "#/components/schemas/Currency" }

    HourlyRateDto:
      allOf:
        - $ref: "#/components/schemas/RateDto"

    CostRateDto:
      allOf:
        - $ref: "#/components/schemas/RateDto"

    DatePeriod:
      type: object
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date, example: "2026-05-01" }
        endDate:   { type: string, format: date, example: "2026-05-01" }

    DateTimeInterval:
      type: object
      properties:
        start: { type: string, format: date-time }
        end:   { type: string, format: date-time, nullable: true }
        duration: { type: string, nullable: true, description: "ISO 8601 duration, e.g. PT1H30M" }
        timeZone: { type: string, nullable: true }
        zonedStart: { type: string, nullable: true }
        zonedEnd:   { type: string, nullable: true }
        offStart:   { type: integer, nullable: true }
        offEnd:     { type: integer, nullable: true }

    # ---------- error envelope ----------
    ClockifyError:
      type: object
      description: |
        Clockify error envelope. Body shape is `{message, code}` where
        `code` is an internal *application* error code (commonly 501,
        3000, 3001, 3002, 4006, 4033) and is NOT the HTTP status. The
        HTTP status conveys the transport-level outcome (400, 403, 404,
        405, 409); the inner `code` disambiguates the upstream cause:
          • 501 → generic validation failure (often paired with HTTP 400)
          • 3000 → method not supported on this sub-resource (HTTP 405)
          • 3001 / 3002 → resource not found / not in this workspace
          • 4006 → approval-request state-machine violation
          • 4033 → permission / role insufficient
        Many mutation endpoints reply with HTTP 400 + body `code:501` for
        any validation failure; many GET-on-sub-resource paths reply with
        HTTP 405 + body `code:3000`.
      required: [message, code]
      properties:
        message: { type: string }
        code:    { type: integer, description: "Internal app code, not HTTP status" }

    ErrorResponse:
      description: "Alias of ClockifyError (operator-specified canonical name)."
      allOf: [{ $ref: "#/components/schemas/ClockifyError" }]

    # ---------- user ----------
    UserMembership:
      type: object
      properties:
        userId:      { type: string }
        hourlyRate:  { $ref: "#/components/schemas/RateDto", nullable: true }
        costRate:    { $ref: "#/components/schemas/RateDto", nullable: true }
        targetId:    { type: string }
        membershipType:   { type: string, enum: [WORKSPACE, PROJECT, TASK, USERGROUP] }
        membershipStatus: { type: string, enum: [PENDING, ACTIVE, INACTIVE, DECLINED] }

    User:
      type: object
      properties:
        id:                 { type: string }
        email:              { type: string, format: email }
        name:               { type: string }
        memberships:        { type: array, items: { $ref: "#/components/schemas/UserMembership" } }
        profilePicture:     { type: string }
        activeWorkspace:    { type: string }
        defaultWorkspace:   { type: string }
        settings:           { type: object, additionalProperties: true }
        status:             { type: string, enum: [ACTIVE, PENDING_EMAIL_VERIFICATION, DELETED] }
        customFields:       { type: array, items: { type: object, additionalProperties: true } }

    UserRole:
      type: object
      properties:
        workspaceId: { type: string }
        userId:      { type: string }
        role:
          type: object
          properties:
            name:   { type: string, enum: [WORKSPACE_ADMIN, PROJECT_MANAGER, TEAM_MANAGER, OWNER] }
            id:     { type: string }
            source: { type: string, nullable: true, enum: [USER_GROUP, null] }

    RoleAssignRequest:
      type: object
      required: [role, entityId]
      description: |
        Role assignment semantics (verified live):
          • role=WORKSPACE_ADMIN  → entityId is the workspaceId
          • role=PROJECT_MANAGER  → entityId is the projectId
          • role=TEAM_MANAGER     → entityId is the userId of the managed user
                                    (no `sourceType`) OR
                                    entityId is the user-group id with
                                    `sourceType=USER_GROUP`
        Re-adding an existing role returns HTTP 400 with
        `{message: "Roles were not updated because role already exists.", code:501}`.
        Adding `WORKSPACE_ADMIN` for the first time returns 201 with an
        array of UserRole objects.
      properties:
        role:       { type: string, enum: [WORKSPACE_ADMIN, PROJECT_MANAGER, TEAM_MANAGER] }
        entityId:   { type: string }
        sourceType: { type: string, enum: [USER_GROUP] }

    # ---------- workspace ----------
    WorkspaceSettings:
      type: object
      additionalProperties: true
      description: |
        Workspace settings is a large, mostly-flat dictionary (~80 keys)
        controlling features (timeRoundingInReports, lockTimeEntries,
        timeFormat, decimalFormat, projectFavorites, etc.). The exact
        keys are tied to the workspace's plan tier and are stable but
        not enumerated here; treat as `additionalProperties: true`.

    Workspace:
      type: object
      properties:
        id:                { type: string }
        name:              { type: string }
        hourlyRate:        { $ref: "#/components/schemas/RateDto" }
        memberships:       { type: array, items: { $ref: "#/components/schemas/UserMembership" } }
        workspaceSettings: { $ref: "#/components/schemas/WorkspaceSettings" }
        imageUrl:          { type: string, nullable: true }
        featureSubscriptionType: { type: string }
        currencies:        { type: array, items: { $ref: "#/components/schemas/Currency" } }
        subdomain:
          type: object
          nullable: true
          additionalProperties: true

    # ---------- client ----------
    Client:
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        email:       { type: string, format: email, nullable: true }
        workspaceId: { type: string }
        archived:    { type: boolean }
        address:     { type: string, nullable: true }
        note:        { type: string, nullable: true }
        currencyCode: { $ref: "#/components/schemas/Currency" }
        currencyId:  { type: string, nullable: true }
        ccEmails:
          type: array
          nullable: true
          items: { type: string }

    ClientCreate:
      type: object
      required: [name]
      properties:
        name:    { type: string }
        email:   { type: string, format: email }
        address: { type: string }
        note:    { type: string }
        currencyCode: { $ref: "#/components/schemas/Currency" }

    ClientUpdate: { $ref: "#/components/schemas/ClientCreate" }

    # ---------- project ----------
    EstimateDto:
      type: object
      properties:
        estimate: { type: string, description: "ISO 8601 duration string, e.g. PT8H" }
        type:     { type: string, enum: [AUTO, MANUAL] }

    BudgetEstimateDto:
      type: object
      properties:
        estimate: { type: number }
        type:     { type: string, enum: [AUTO, MANUAL] }
        resetOption: { type: string, nullable: true, enum: [MONTHLY, QUARTERLY, YEARLY, null] }
        active:   { type: boolean }

    Project:
      type: object
      properties:
        id:           { type: string }
        name:         { type: string }
        hourlyRate:   { $ref: "#/components/schemas/RateDto" }
        costRate:     { $ref: "#/components/schemas/RateDto", nullable: true }
        clientId:     { type: string, nullable: true }
        workspaceId:  { type: string }
        billable:     { type: boolean }
        memberships:  { type: array, items: { $ref: "#/components/schemas/UserMembership" } }
        color:        { type: string }
        estimate:     { $ref: "#/components/schemas/EstimateDto" }
        archived:     { type: boolean }
        duration:     { type: string, nullable: true }
        clientName:   { type: string, nullable: true }
        note:         { type: string, nullable: true }
        timeEstimate: { type: object, additionalProperties: true }
        budgetEstimate: { $ref: "#/components/schemas/BudgetEstimateDto" }
        estimateReset: { type: object, nullable: true, additionalProperties: true }
        template:     { type: boolean }
        public:       { type: boolean }

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:       { type: string }
        clientId:   { type: string }
        isPublic:   { type: boolean, default: false }
        billable:   { type: boolean, default: false }
        color:      { type: string }
        note:       { type: string }
        hourlyRate: { $ref: "#/components/schemas/RateDto" }
        costRate:   { $ref: "#/components/schemas/RateDto" }

    ProjectMembershipsPatch:
      type: object
      description: |
        REPLACE semantics confirmed live (May 2026). PATCH with an
        explicit array of member objects replaces the project's current
        membership list — callers must send the full desired list.
        The legacy `PUT /projects/{id}/memberships` returns 405.
      required: [memberships]
      properties:
        memberships:
          type: array
          items:
            type: object
            required: [userId]
            properties:
              userId:           { type: string }
              membershipStatus: { type: string, enum: [PENDING, ACTIVE, INACTIVE, DECLINED] }
              hourlyRate:       { $ref: "#/components/schemas/RateDto" }
              costRate:         { $ref: "#/components/schemas/RateDto" }

    # ---------- task ----------
    Task:
      type: object
      properties:
        id:              { type: string }
        name:            { type: string }
        projectId:       { type: string }
        assigneeIds:     { type: array, items: { type: string } }
        userGroupIds:    { type: array, items: { type: string } }
        estimate:        { type: string, nullable: true, description: "ISO 8601 duration" }
        status:          { type: string, enum: [ACTIVE, DONE] }
        budgetEstimate:  { type: number, nullable: true }
        billable:        { type: boolean }
        hourlyRate:      { $ref: "#/components/schemas/RateDto", nullable: true }
        costRate:        { $ref: "#/components/schemas/RateDto", nullable: true }
        duration:        { type: string, nullable: true }

    TaskCreate:
      type: object
      required: [name]
      properties:
        name:         { type: string }
        assigneeIds:  { type: array, items: { type: string } }
        userGroupIds: { type: array, items: { type: string } }
        billable:     { type: boolean }
        estimate:     { type: string }
        status:       { type: string, enum: [ACTIVE, DONE] }

    # ---------- tag ----------
    Tag:
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        workspaceId: { type: string }
        archived:    { type: boolean }

    TagCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }

    # ---------- time entry ----------
    TimeEntry:
      type: object
      properties:
        id:                { type: string }
        description:       { type: string }
        tagIds:            { type: array, nullable: true, items: { type: string } }
        userId:            { type: string }
        billable:          { type: boolean }
        taskId:            { type: string, nullable: true }
        projectId:         { type: string, nullable: true }
        workspaceId:       { type: string }
        timeInterval:      { $ref: "#/components/schemas/DateTimeInterval" }
        customFieldValues: { type: array, items: { type: object, additionalProperties: true } }
        type:              { type: string, enum: [REGULAR, BREAK, TIMEOFF, HOLIDAY, OVERTIME] }
        kioskId:           { type: string, nullable: true }
        hourlyRate:        { $ref: "#/components/schemas/RateDto", nullable: true }
        costRate:          { $ref: "#/components/schemas/RateDto", nullable: true }
        isLocked:          { type: boolean }
        approvalRequestId: { type: string, nullable: true }

    TimeEntryCreate:
      type: object
      required: [start]
      properties:
        start:        { type: string, format: date-time, description: "Required ISO 8601" }
        end:          { type: string, format: date-time, description: "Omit to start a running timer" }
        billable:     { type: boolean }
        description:  { type: string }
        projectId:    { type: string }
        taskId:       { type: string }
        tagIds:       { type: array, items: { type: string } }
        customFields:
          type: array
          items:
            type: object
            properties:
              customFieldId: { type: string }
              sourceType:    { type: string, enum: [WORKSPACE, PROJECT] }
              value:         { description: "Polymorphic — string/number/array depending on custom-field type" }
        type:         { type: string, enum: [REGULAR, BREAK] }

    TimeEntryUpdate:
      allOf:
        - $ref: "#/components/schemas/TimeEntryCreate"

    # ---------- group ----------
    UserGroup:
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        workspaceId: { type: string }
        userIds:     { type: array, items: { type: string } }

    UserGroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }

    # ---------- holiday ----------
    Holiday:
      type: object
      properties:
        id:              { type: string }
        name:            { type: string }
        workspaceId:     { type: string }
        datePeriod:      { $ref: "#/components/schemas/DatePeriod" }
        occursAnnually:  { type: boolean }
        users:
          type: object
          properties:
            ids:      { type: array, items: { type: string } }
            contains: { type: string, enum: [CONTAINS, DOES_NOT_CONTAIN, CONTAINS_ONLY] }
            status:   { type: string, enum: [ALL, ACTIVE, INACTIVE] }
        userGroups:
          type: object
          properties:
            ids:      { type: array, items: { type: string } }
            contains: { type: string, enum: [CONTAINS, DOES_NOT_CONTAIN, CONTAINS_ONLY] }

    HolidayCreate:
      type: object
      required: [name, datePeriod]
      description: |
        VERIFIED LIVE:
          • `date` flat field is rejected (400). MUST use `datePeriod.{startDate,endDate}` in `yyyy-MM-dd`.
          • Body MUST include at least one of `users.ids` or `userGroups.ids`
            (server returns `400 code:501 "At least one user or user group must be assigned"`).
          • The docs say `recurring`; upstream accepts `occursAnnually`.
      properties:
        name:           { type: string }
        datePeriod:     { $ref: "#/components/schemas/DatePeriod" }
        occursAnnually: { type: boolean }
        users:
          type: object
          properties:
            ids: { type: array, items: { type: string } }
        userGroups:
          type: object
          properties:
            ids: { type: array, items: { type: string } }

    # ---------- custom fields ----------
    CustomField:
      type: object
      properties:
        id:            { type: string }
        name:          { type: string }
        type:
          type: string
          description: "VERIFIED ENUM (live-rejected `TEXT`/`DROPDOWN` aliases)."
          enum: [TXT, NUMBER, DROPDOWN_SINGLE, DROPDOWN_MULTIPLE, CHECKBOX, LINK]
        workspaceId:   { type: string }
        description:   { type: string, nullable: true }
        allowedValues: { type: array, items: { type: string }, nullable: true }
        status:        { type: string, enum: [VISIBLE, INVISIBLE, INACTIVE] }
        onlyAdminCanEdit: { type: boolean }
        projectDefaultValues: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        entityType:    { type: string, enum: [WORKSPACE, USER, TIMEENTRY, EXPENSE] }

    CustomFieldCreate:
      type: object
      required: [name, type]
      properties:
        name:          { type: string }
        type:          { $ref: "#/components/schemas/CustomField/properties/type" }
        description:   { type: string }
        allowedValues: { type: array, items: { type: string } }
        onlyAdminCanEdit: { type: boolean }
        entityType:    { type: string, enum: [WORKSPACE, USER, TIMEENTRY, EXPENSE] }

    # ---------- expenses ----------
    ExpenseCategory:
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        unit:        { type: string }
        priceInCents: { type: integer }
        archived:    { type: boolean }
        workspaceId: { type: string }
        hasUnitPrice: { type: boolean }
        priority:    { type: integer }

    Expense:
      type: object
      properties:
        id:         { type: string }
        userId:     { type: string }
        workspaceId: { type: string }
        date:       { type: string, format: date-time }
        projectId:  { type: string, nullable: true }
        taskId:     { type: string, nullable: true }
        categoryId: { type: string }
        notes:      { type: string, nullable: true }
        quantity:   { type: number, nullable: true }
        total:      { type: number, description: "Stored in minor units. Input 1.50 → total 150.0." }
        billable:   { type: boolean }
        fileId:     { type: string, nullable: true }
        fileName:   { type: string, nullable: true }
        locked:     { type: boolean }
        approvalRequestId: { type: string, nullable: true }
        customFieldValues: { type: array, items: { type: object, additionalProperties: true } }
        budgetEstimate: { type: number, nullable: true }
        category:   { $ref: "#/components/schemas/ExpenseCategory" }

    ExpenseListEnvelope:
      type: object
      description: |
        Double-nested envelope; the outer `expenses` is an OBJECT and
        the inner `expenses` is the array. `weeklyTotals` and
        `dailyTotals` ride alongside.
      properties:
        expenses:
          type: object
          properties:
            expenses: { type: array, items: { $ref: "#/components/schemas/Expense" } }
            count:    { type: integer }
        weeklyTotals: { type: array, items: { type: object, additionalProperties: true } }
        dailyTotals:  { type: array, items: { type: object, additionalProperties: true } }

    # ---------- approvals ----------
    Approval:
      type: object
      description: "Approval request envelope (timesheet submission for a date range)."
      properties:
        id:              { type: string }
        workspaceId:     { type: string }
        ownerName:       { type: string }
        ownerEmail:      { type: string, format: email }
        owner:
          type: object
          properties:
            userId: { type: string }
        dateRange:       { $ref: "#/components/schemas/DateTimeInterval" }
        creator:         { type: object, additionalProperties: true }
        updatedBy:       { type: object, nullable: true, additionalProperties: true }
        status:
          type: object
          properties:
            state: { type: string, enum: [PENDING, APPROVED, WITHDRAWN_SUBMISSION, REJECTED, WITHDRAWN_APPROVAL] }
            updatedAt: { type: string, format: date-time }
            note: { type: string, nullable: true }

    # ---------- time off ----------
    TimeOffPolicy:
      type: object
      properties:
        id:              { type: string }
        name:            { type: string }
        workspaceId:     { type: string }
        archived:        { type: boolean }
        timeUnit:        { type: string, enum: [DAYS, HOURS] }
        color:           { type: string }
        amount:          { type: number }
        approve:         { type: object, additionalProperties: true }
        automaticAccrual: { type: object, nullable: true, additionalProperties: true }
        allowHalfDay:    { type: boolean }
        allowNegativeBalance: { type: boolean }
        negativeBalance: { type: object, nullable: true, additionalProperties: true }
        userAllowanceType: { type: string, nullable: true }
        users:           { type: object, additionalProperties: true }
        userGroups:      { type: object, additionalProperties: true }
        everyoneIncludingNew: { type: boolean }
        accountingPeriod: { type: object, nullable: true, additionalProperties: true }
        carryOver:       { type: object, nullable: true, additionalProperties: true }

    TimeOffRequest:
      type: object
      # Live probes 2026-05-24 against the sacrificial workspace (POST
      # /workspaces/{ws}/time-off/requests, 195 records across PENDING /
      # APPROVED / REJECTED) confirmed every property below is present on
      # 100% of records. Probe captures live at
      # addons-me/fern/spec/evidence/probes/20260524-time-off-requests-*.json.
      # The GET-by-id endpoint Clockify documents (
      # /workspaces/{ws}/time-off/requests/{requestId}) returns 405; the
      # only way to read a single request is the POST search above. The
      # PATCH /status response is documented as sparse — see the
      # endpoint description, not this schema.
      properties:
        id:          { type: string }
        workspaceId: { type: string }
        policyId:    { type: string }
        policyName:  { type: string }
        timeUnit:    { type: string, enum: [DAYS, HOURS] }
        userId:      { type: string }
        userName:    { type: string }
        userEmail:   { type: string, format: email }
        userTimeZone: { type: string }
        timeOffPeriod:
          type: object
          properties:
            period:   { $ref: "#/components/schemas/DateTimeInterval" }
            halfDay:  { type: boolean }
            halfDayPeriod:
              type: string
              enum: [NOT_DEFINED, FIRST_HALF, SECOND_HALF]
            halfDayHours:
              type: object
              nullable: true
              description: |-
                Populated when `halfDay=true`. `null` otherwise. The window is
                anchored in UTC even when the user's profile sets a different
                time zone — clients should render in `userTimeZone`.
              properties:
                start: { type: string, format: date-time }
                end:   { type: string, format: date-time }
        note:        { type: string, nullable: true }
        status:
          # Live probe 2026-05-24 (workspace 65b382b6…, request 6a0a5471…):
          # the real shape uses changedByUserId/changedByUserName/
          # changedForUserName/changedAt/note/statusType. The earlier
          # inline definition (createdBy/changedBy/createdAt at status
          # level) does not exist on the wire. Use the named schema
          # defined in realOPENAPI/TIMEOFFOPENAPI.YAML.
          $ref: '#/components/schemas/TimeOffRequestStatus'
        balanceDiff: { type: number, format: double }
        balance:     { type: number, format: double }
        createdAt:   { type: string, format: date-time }
        requesterUserId:   { type: string }
        requesterUserName: { type: string }

    TimeOffRequestCreate:
      type: object
      required: [policyId, timeOffPeriod]
      properties:
        policyId: { type: string }
        note:     { type: string }
        timeOffPeriod:
          type: object
          required: [period]
          properties:
            period:  { $ref: "#/components/schemas/DateTimeInterval" }
            halfDay: { type: boolean }

    Balance:
      type: object
      properties:
        userId:           { type: string }
        policyId:         { type: string }
        balance:          { type: number }
        usedThisPeriod:   { type: number }
        carriedOver:      { type: number }
        period:
          type: object
          properties:
            start: { type: string, format: date }
            end:   { type: string, format: date }

    # ---------- invoice ----------
    InvoiceLineItem:
      type: object
      properties:
        id:        { type: string }
        description: { type: string }
        quantity:  { type: number }
        unitPrice: { type: integer, description: "Minor units (cents). 100000 = 1000.00." }
        amount:    { type: integer }
        taxRate:   { type: number, nullable: true }
        taxRate2:  { type: number, nullable: true }
        discount:  { type: number, nullable: true }

    Invoice:
      type: object
      properties:
        id:           { type: string }
        number:       { type: string }
        clientId:     { type: string }
        clientName:   { type: string }
        workspaceId:  { type: string }
        status:       { type: string, enum: [UNSENT, SENT, PAID, VOID, PARTIALLY_PAID] }
        currency:     { $ref: "#/components/schemas/Currency" }
        amount:       { type: integer }
        paidAmount:   { type: integer }
        issuedDate:   { type: string, format: date }
        dueDate:      { type: string, format: date }
        note:         { type: string, nullable: true }
        subject:      { type: string, nullable: true }
        items:        { type: array, items: { $ref: "#/components/schemas/InvoiceLineItem" } }
        tax:          { type: object, additionalProperties: true, nullable: true }
        discount:     { type: object, additionalProperties: true, nullable: true }
        payments:     { type: array, items: { type: object, additionalProperties: true } }
        notes:        { type: string, nullable: true }
        clientAddress: { type: string, nullable: true }
        companyName:  { type: string, nullable: true }
        companyAddress: { type: string, nullable: true }
        containsImportedEntries: { type: boolean }

    InvoiceListResponse:
      type: object
      properties:
        total:    { type: integer }
        invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }

    # ---------- webhook ----------
    Webhook:
      type: object
      properties:
        id:            { type: string }
        workspaceId:   { type: string }
        userId:        { type: string }
        url:           { type: string, format: uri }
        triggerSource:
          type: array
          items: { type: string }
        triggerSourceType:
          type: string
          enum: [USER_ID, PROJECT_ID, TAG_ID, TASK_ID, CLIENT_ID, USER_GROUP_ID, WORKSPACE_ID]
        webhookEvent:
          type: string
          enum:
            # 52-value live enum (subset shown; matches findings/webhooks.md)
            [NEW_PROJECT, PROJECT_DELETED, PROJECT_UPDATED, NEW_TASK, TASK_UPDATED, TASK_DELETED,
             NEW_CLIENT, CLIENT_UPDATED, CLIENT_DELETED, NEW_TAG, TAG_UPDATED, TAG_DELETED,
             NEW_TIME_ENTRY, TIME_ENTRY_UPDATED, TIME_ENTRY_DELETED, TIMER_STARTED, TIMER_STOPPED,
             NEW_INVOICE, INVOICE_UPDATED, INVOICE_DELETED, INVOICE_PAID, INVOICE_SENT,
             NEW_APPROVAL_REQUEST, APPROVAL_REQUEST_STATUS_UPDATED,
             NEW_TIME_OFF_REQUEST, TIME_OFF_REQUEST_APPROVED, TIME_OFF_REQUEST_REJECTED, TIME_OFF_REQUEST_WITHDRAWN,
             USER_DELETED_FROM_WORKSPACE, USER_JOINED_WORKSPACE, USER_DEACTIVATED_ON_WORKSPACE, USER_ACTIVATED_ON_WORKSPACE,
             USER_EMAIL_CHANGED, USER_UPDATED,
             NEW_EXPENSE, EXPENSE_UPDATED, EXPENSE_DELETED,
             ASSIGNMENT_CREATED, ASSIGNMENT_UPDATED, ASSIGNMENT_DELETED, ASSIGNMENT_PUBLISHED,
             NEW_USER_GROUP, USER_GROUP_UPDATED, USER_GROUP_DELETED,
             KIOSK_NEW_PIN, KIOSK_PIN_RESET,
             BALANCE_UPDATED, POLICY_CREATED, POLICY_UPDATED, POLICY_DELETED,
             HOLIDAY_CREATED, HOLIDAY_UPDATED, HOLIDAY_DELETED]
        name:          { type: string, nullable: true }
        authToken:     { type: string, description: "HMAC secret. Treat as a credential; never log." }
        enabled:       { type: boolean }
        deliveryEnabled: { type: boolean, nullable: true }
        planEnabled:     { type: boolean, nullable: true }
        addonId:       { type: string, nullable: true }

    WebhookCreate:
      type: object
      required: [url, webhookEvent]
      properties:
        url:              { type: string, format: uri, example: "https://example.com/clockify-probe" }
        name:             { type: string }
        webhookEvent:     { $ref: "#/components/schemas/Webhook/properties/webhookEvent" }
        triggerSource:    { type: array, items: { type: string } }
        triggerSourceType: { $ref: "#/components/schemas/Webhook/properties/triggerSourceType" }

    WebhookListEnvelope:
      type: object
      properties:
        workspaceWebhookCount: { type: integer }
        webhooks: { type: array, items: { $ref: "#/components/schemas/Webhook" } }

    # ---------- scheduling ----------
    SchedulingAssignment:
      type: object
      properties:
        id:           { type: string }
        userId:       { type: string }
        projectId:    { type: string }
        taskId:       { type: string, nullable: true }
        workspaceId:  { type: string }
        period:       { $ref: "#/components/schemas/DateTimeInterval" }
        hoursPerDay:  { type: number }
        note:         { type: string, nullable: true }
        published:    { type: boolean }
        seriesId:     { type: string, nullable: true }
        billable:     { type: boolean }
        includeNonWorkingDays: { type: boolean }

    # ---------- reports ----------
    ReportTotalsItem:
      type: object
      properties:
        totalTime:         { type: integer }
        totalBillableTime: { type: integer }
        entriesCount:      { type: integer }
        amounts:
          type: array
          items:
            type: object
            properties:
              type:  { type: string, enum: [EARNED, COST, REMAINING] }
              value: { type: number }
              amountByCurrency:
                type: array
                items:
                  type: object
                  properties:
                    currency: { $ref: "#/components/schemas/Currency" }
                    amount:   { type: number }
        numOfCurrencies:        { type: integer }
        _id:                    { type: string }
        totalAmount:            { type: number }
        totalAmountByCurrency:  { type: array, items: { type: object, additionalProperties: true } }

    SummaryFilter:
      type: object
      description: |
        VERIFIED: only `summaryFilter` is accepted on the summary
        endpoint (NOT `detailedFilter`/`weeklyFilter`/`attendanceFilter`).
      required: [groups]
      properties:
        groups:
          type: array
          maxItems: 3
          items:
            type: string
            enum: [CLIENT, PROJECT, TASK, DATE, WEEK, MONTH, TIMEENTRY, USER, TAG]
        sortColumn: { type: string }

    DetailedFilter:
      type: object
      description: "VERIFIED: only `detailedFilter` accepted on detailed endpoint."
      properties:
        page:        { type: integer, default: 1 }
        pageSize:    { type: integer, default: 50 }
        sortColumn:  { type: string }
        sortOrder:   { type: string, enum: [ASCENDING, DESCENDING] }
        auditFilter: { type: object, additionalProperties: true }
        options:     { type: object, additionalProperties: true }

    WeeklyFilter:
      type: object
      description: |
        VERIFIED: only `weeklyFilter` accepted on weekly endpoint.
        Date range MUST be exactly 7 days or upstream returns
        `{code:501, message:"Please select date range of exactly 7 days for weekly report"}`.
      required: [group, subgroup]
      properties:
        group:    { type: string, enum: [PROJECT, USER] }
        subgroup: { type: string, enum: [TIME] }

    AttendanceFilter:
      type: object
      description: "VERIFIED: only `attendanceFilter` accepted on attendance endpoint."
      properties:
        page:     { type: integer, default: 1 }
        pageSize: { type: integer, default: 50 }
        users:
          type: object
          properties:
            ids:      { type: array, items: { type: string } }
            contains: { type: string, enum: [CONTAINS, DOES_NOT_CONTAIN, CONTAINS_ONLY] }
            status:   { type: string, enum: [ALL, ACTIVE, INACTIVE] }

    BaseReportRequest:
      type: object
      required: [dateRangeStart, dateRangeEnd]
      properties:
        dateRangeStart: { type: string, format: date-time }
        dateRangeEnd:   { type: string, format: date-time }
        users:          { type: object, additionalProperties: true }
        userGroups:     { type: object, additionalProperties: true }
        clients:        { type: object, additionalProperties: true }
        projects:       { type: object, additionalProperties: true }
        tasks:          { type: object, additionalProperties: true }
        tags:           { type: object, additionalProperties: true }
        billable:       { type: boolean }
        description:    { type: string }
        timeZone:       { type: string }
        exportType:     { type: string, enum: [JSON_V1, JSON, CSV, XLSX, PDF] }

    SummaryReportRequest:
      allOf:
        - $ref: "#/components/schemas/BaseReportRequest"
        - type: object
          required: [summaryFilter]
          properties:
            summaryFilter: { $ref: "#/components/schemas/SummaryFilter" }

    DetailedReportRequest:
      allOf:
        - $ref: "#/components/schemas/BaseReportRequest"
        - type: object
          required: [detailedFilter]
          properties:
            detailedFilter: { $ref: "#/components/schemas/DetailedFilter" }

    WeeklyReportRequest:
      allOf:
        - $ref: "#/components/schemas/BaseReportRequest"
        - type: object
          required: [weeklyFilter]
          properties:
            weeklyFilter: { $ref: "#/components/schemas/WeeklyFilter" }

    AttendanceReportRequest:
      allOf:
        - $ref: "#/components/schemas/BaseReportRequest"
        - type: object
          required: [attendanceFilter]
          properties:
            attendanceFilter: { $ref: "#/components/schemas/AttendanceFilter" }

    SummaryReportResponse:
      type: object
      description: "Live capture: fixtures/reports-final/report-summary.json"
      properties:
        totals:      { type: array, items: { $ref: "#/components/schemas/ReportTotalsItem" } }
        donutChart:  { type: array, items: { type: object, additionalProperties: true } }
        groupTotals:
          type: object
          properties:
            groupOneTotalCount: { type: integer }
            groupTwoTotalCount: { type: integer }
        groupOne:    { type: array, items: { type: object, additionalProperties: true } }

    DetailedReportResponse:
      type: object
      description: "Live capture: fixtures/reports-final/report-detailed.json"
      properties:
        totals:      { type: array, items: { $ref: "#/components/schemas/ReportTotalsItem" } }
        timeentries: { type: array, items: { type: object, additionalProperties: true } }

    WeeklyReportResponse:
      type: object
      description: "Live capture: fixtures/reports-final/report-weekly.json"
      properties:
        totals:      { type: array, items: { $ref: "#/components/schemas/ReportTotalsItem" } }
        totalsByDay:
          type: array
          items:
            type: object
            properties:
              date:      { type: string, format: date }
              duration:  { type: integer }
              amount:    { type: number }
              amountByCurrency:
                type: array
                items:
                  type: object
                  properties:
                    currency: { $ref: "#/components/schemas/Currency" }
                    amount:   { type: number }
        groupOne:    { type: array, items: { type: object, additionalProperties: true } }

    AttendanceReportResponse:
      type: object
      description: "Live capture: fixtures/reports-final/report-attendance.json"
      properties:
        entities:
          type: array
          items:
            type: object
            properties:
              userId:        { type: string }
              userName:      { type: string }
              date:          { type: string, format: date-time }
              totalDuration: { type: integer }
              break:         { type: integer }
              hasRunningEntry: { type: boolean }
              capacity:      { type: integer }
              imageUrl:      { type: string }
              timeOff:       { type: integer }
              overtime:      { type: integer }
              remainingCapacity: { type: integer }
              zonedStart:    { type: string, nullable: true }
              zonedEnd:      { type: string, nullable: true }

    # ---------- shared reports ----------
    SharedReportFilter:
      type: object
      required: [exportType, dateRangeStart, dateRangeEnd]
      properties:
        exportType:     { type: string, enum: [JSON_V1, JSON, CSV, XLSX, PDF] }
        dateRangeStart: { type: string, format: date-time }
        dateRangeEnd:   { type: string, format: date-time }
        summaryFilter:  { $ref: "#/components/schemas/SummaryFilter" }
        detailedFilter: { $ref: "#/components/schemas/DetailedFilter" }
        weeklyFilter:   { $ref: "#/components/schemas/WeeklyFilter" }
        attendanceFilter: { $ref: "#/components/schemas/AttendanceFilter" }

    SharedReportCreate:
      type: object
      required: [name, type, filter]
      description: |
        Body keys: `type` (NOT reportType) and `filter` (NOT filters,
        singular). Required nested fields:
          filter.exportType, filter.dateRangeStart, filter.dateRangeEnd.
      properties:
        name:       { type: string }
        type:
          type: string
          enum:
            [SUMMARY, DETAILED, WEEKLY, EXPENSE_DETAILED, INVOICE_TIME,
             KIOSK_PIN_LIST, ATTENDANCE_DETAILED, ATTENDANCE_SUMMARY,
             ASSIGNMENT_LIST, ASSIGNMENT_SCHEDULE, APPROVAL_DETAILED,
             APPROVAL_SUMMARY, BALANCE_LIST, INVOICE_AMOUNT_LIST,
             INVOICE_DETAILED, TIMEOFF_DETAILED, TIMEOFF_HOLIDAY,
             TIMEOFF_BALANCE, EXPENSE_SUMMARY]
        filter:     { $ref: "#/components/schemas/SharedReportFilter" }
        # Live-verified 2026-06-23: the create/update body field is `isPublic`.
        # Sending `public` is silently ignored by the API (report stays private).
        isPublic:   { type: boolean }

    SharedReport:
      # Live-verified response shape (GET list + POST create, sandbox 2026-06-23):
      # the wire uses `isPublic` (NOT public) and `link` (NOT url). The list adds
      # reportAuthor/link; create adds workspaceId/userId/filter. There is no
      # url/createdAt/updatedAt/workspace top-level field on the wire.
      type: object
      properties:
        id:          { type: string }
        name:        { type: string }
        type:        { $ref: "#/components/schemas/SharedReportCreate/properties/type" }
        isPublic:    { type: boolean }
        link:        { type: string, nullable: true }
        reportAuthor: { type: string, nullable: true }
        fixedDate:   { type: boolean, nullable: true }
        visibleToUsers:
          type: array
          nullable: true
          items: { type: object, additionalProperties: true }
        visibleToUserGroups:
          type: array
          nullable: true
          items: { type: object, additionalProperties: true }
        workspaceId: { type: string, nullable: true }
        userId:      { type: string, nullable: true }
        filter:      { $ref: "#/components/schemas/SharedReportFilter" }

    SharedReportListEnvelope:
      type: object
      properties:
        count:   { type: integer }
        reports: { type: array, items: { $ref: "#/components/schemas/SharedReport" } }

    SharedReportExportEnvelope:
      type: object
      description: |
        Binary-aware envelope: PDF/XLSX bodies are binary, CSV is text.
        `body` is base64-encoded raw bytes; `filename` parsed from
        `Content-Disposition` header.
      properties:
        contentType: { type: string }
        filename:    { type: string }
        body:        { type: string, format: byte }

paths:

  # ===========================================================================
  # USER
  # ===========================================================================

  /user:
    get:
      tags: [User]
      summary: Get current user (the authenticated principal)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /workspaces/{workspaceId}/users:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [User]
      summary: List users in the workspace
      parameters:
        - name: email
          in: query
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, PENDING_EMAIL_VERIFICATION, DELETED, NOT_INTEGRATED, INACTIVE] }
        - name: account-statuses
          in: query
          schema: { type: array, items: { type: string } }
        - name: roles
          in: query
          schema: { type: array, items: { type: string } }
        - name: includeRoles
          in: query
          schema: { type: boolean }
        - name: memberships
          in: query
          schema: { type: string, enum: [ALL, NONE, WORKSPACE, PROJECT, USERGROUP] }
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeHyphen" }
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }

  /workspaces/{workspaceId}/users/{userId}/roles:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/UserId" }
    post:
      tags: [User]
      summary: Grant a role to a user
      description: |
        VERIFIED LIVE (2026-05-12). See `RoleAssignRequest` for the
        entityId semantics. GET is not supported (405).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAssignRequest" }
      responses:
        '201':
          description: Returns the new roles array.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserRole" }
        '400':
          description: Role already exists, or invalid entityId for role type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClockifyError" }
    delete:
      tags: [User]
      summary: Revoke a role from a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAssignRequest" }
      responses:
        '204': { description: Role revoked }

  # ===========================================================================
  # WORKSPACE
  # ===========================================================================

  /workspaces:
    get:
      tags: [Workspace]
      summary: List workspaces visible to the principal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }

  /workspaces/{workspaceId}:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Workspace]
      summary: Get workspace by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }

  /workspaces/{workspaceId}/cost-rate:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    put:
      tags: [Workspace]
      summary: Set workspace-wide cost rate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateDto" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }

  /workspaces/{workspaceId}/hourly-rate:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    put:
      tags: [Workspace]
      summary: Set workspace-wide hourly rate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateDto" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }

  # ===========================================================================
  # CLIENT
  # ===========================================================================

  /workspaces/{workspaceId}/clients:
    parameters: [{ $ref: "#/components/parameters/WorkspaceId" }]
    get:
      tags: [Client]
      summary: List clients
      parameters:
        - { name: name, in: query, schema: { type: string } }
        - { name: archived, in: query, schema: { type: boolean } }
        - { name: address, in: query, schema: { type: string } }
        - { name: note, in: query, schema: { type: string } }
        - { name: sort-column, in: query, schema: { type: string, enum: [NAME, EMAIL, NOTE] } }
        - { name: sort-order, in: query, schema: { type: string, enum: [ASCENDING, DESCENDING] } }
        - { $ref: "#/components/parameters/PageQuery" }
        - { $ref: "#/components/parameters/PageSizeHyphen" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Client" } }
    post:
      tags: [Client]
      summary: Create client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientCreate" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }

  /workspaces/{workspaceId}/clients/{clientId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/ClientId" }
    get:
      tags: [Client]
      summary: Get client
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
    put:
      tags: [Client]
      summary: Update client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdate" }
      responses:
        '200':
          description: OK
          content:
            application/json:
