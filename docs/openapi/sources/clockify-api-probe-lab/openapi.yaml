  # ===========================================================================
  # USER ADMIN — member profile + per-user CF write (from USEREXPENCUSTOMFIED)
  # ===========================================================================

  /workspaces/{workspaceId}/member-profile/{userId}:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/UserId" }
    put:
      tags: [User]
      summary: Update workspace-scoped member profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: { '200': { description: OK } }

  /workspaces/{workspaceId}/users/{userId}/custom-field/{customFieldId}/value:
    parameters:
      - { $ref: "#/components/parameters/WorkspaceId" }
      - { $ref: "#/components/parameters/UserId" }
      - { $ref: "#/components/parameters/CustomFieldId" }
    put:
      tags: [CustomField]
      summary: Set a user-level custom field value
      description: |
        PREREQUISITE: the target customFieldId MUST already exist with
        `entityType: USER`. Setting a value against a TIMEENTRY-scoped
        custom field via this endpoint is not supported — you must
        first create a CF via `POST /workspaces/{wsId}/custom-fields`
        with `{"entityType":"USER","type":<TXT|NUMBER|DROPDOWN_SINGLE|
        DROPDOWN_MULTIPLE|CHECKBOX|LINK>}` and use the returned `id`
        here.

        VERIFIED LIVE (fixtures/user-exp-cf/):
          1. POST /workspaces/{ws}/custom-fields
             body `{"name":"mcp-probe-...-cf-user","type":"TXT",
                    "entityType":"USER","status":"VISIBLE"}` -> 201
             id `<REDACTED_ID>` (cf-create-user-entity.json).
          2. PUT /workspaces/{ws}/users/{userId}/custom-field/
             <REDACTED_ID>/value body `{"value":"hello"}`
             -> 200 returning `{customFieldId, userId, value,
             customFieldName, customFieldType}` (cf-user-value-put.json).

        Note: response is 200 in practice (the public doc claims 201).
        Type-of-`value` must match the parent CF's `type`:
          - TXT / LINK    -> string
          - NUMBER        -> number
          - CHECKBOX      -> boolean
          - DROPDOWN_*    -> one of the parent CF's `allowedValues`
                             (DROPDOWN_MULTIPLE accepts an array).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: |
                    Type-dependent value. See description for the rules
                    keyed off the parent CF's `type`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customFieldId:    { type: string }
                  userId:           { type: string }
                  value:            {}
                  customFieldName:  { type: string }
                  customFieldType:
                    type: string
                    enum: [TXT, NUMBER, DROPDOWN_SINGLE, DROPDOWN_MULTIPLE, CHECKBOX, LINK]
              example:
                customFieldId: "<REDACTED_ID>"
                userId: "<REDACTED_ID>"
                value: "hello"
                customFieldName: "mcp-probe-1778591892-86ea17-cf-user"
                customFieldType: "TXT"

