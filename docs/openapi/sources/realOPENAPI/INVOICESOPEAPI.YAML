openapi: 3.0.3
info:
  title: Clockify Invoices API
  version: 1.0.0
  description: OpenAPI specification generated from the provided INVOICEDOC.md Markdown
    file.
servers:
- url: https://api.clockify.me/api
  description: Clockify API base URL
security:
- ApiKeyAuth: []
- AddonKeyAuth: []
tags:
- name: Invoices
  description: Invoice retrieval, creation, filtering, status, export, duplicate,
    and delete endpoints.
- name: Invoice settings
  description: Invoice default settings and label customization endpoints.
- name: Invoice items
  description: Invoice item creation, import, and deletion endpoints.
- name: Invoice payments
  description: Invoice payment retrieval, creation, and deletion endpoints.
paths:
  /v1/workspaces/{workspaceId}/invoices:
    get:
      tags:
      - Invoices
      summary: Get all invoices on a workspace
      operationId: getWorkspaceInvoices
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/InvoiceStatusesQuery'
      - $ref: '#/components/parameters/InvoiceSortColumnQuery'
      - $ref: '#/components/parameters/SortOrderQuery'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceListResponse'
    post:
      tags:
      - Invoices
      summary: Add an invoice
      operationId: addInvoice
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
            example:
              clientId: 34p687e29ae1f428e7ebe562
              currency: USD
              dueDate: '2020-06-01T08:00:00Z'
              issuedDate: '2020-01-01T08:00:00Z'
              number: '202306121129'
              timeViewMode: AGGREGATED_TIME_VIEW
      responses:
        '201':
          $ref: '#/components/responses/InvoiceCreatedResponse'
  /v1/workspaces/{workspaceId}/invoices/info:
    post:
      tags:
      - Invoices
      summary: Filter out invoices
      operationId: filterInvoices
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceFilterRequest'
            example:
              clients:
                contains: CONTAINS
                ids:
                - 44a687e29ae1f428e7ebe305
                status: ACTIVE
              companies:
                contains: CONTAINS
                ids:
                - 04g687e29ae1f428e7ebe123
              exactAmount: 1000
              exactBalance: 1000
              greaterThanAmount: 500
              greaterThanBalance: 500
              invoiceNumber: Invoice-01
              issueDate:
                issue-date-start: '2024-01-01'
                issue-date-end: '2024-12-31'
              lessThanAmount: 500
              lessThanBalance: 500
              page: 1
              pageSize: 50
              sortColumn: ID
              sortOrder: ASCENDING
              statuses:
              - SENT
              - PAID
              - PARTIALLY_PAID
              strictSearch: false
      responses:
        '200':
          $ref: '#/components/responses/InvoiceInfoListResponse'
  /v1/workspaces/{workspaceId}/invoices/settings:
    get:
      tags:
      - Invoice settings
      summary: Get invoice settings
      description: The source Markdown labels this operation as “Get an invoice in
        another language” and exposes it on the invoice settings endpoint.
      operationId: getInvoiceSettings
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceSettingsResponse'
    put:
      tags:
      - Invoice settings
      summary: Change an invoice language
      operationId: updateInvoiceSettings
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceSettingsRequest'
            example:
              defaults: {}
              exportFields: {}
              labels:
                amount: amount
                billFrom: billFrom
                billTo: billTo
                description: description
                discount: discount
                dueDate: dueDate
                issueDate: issueDate
                itemType: itemType
                notes: notes
                paid: paid
                quantity: quantity
                subtotal: subtotal
                tax: tax
                tax2: tax2
                total: total
                totalAmountDue: totalAmountDue
                unitPrice: unitPrice
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}:
    delete:
      tags:
      - Invoices
      summary: Delete an invoice
      operationId: deleteInvoice
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
    get:
      tags:
      - Invoices
      summary: Get an invoice by ID
      operationId: getInvoiceById
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
    put:
      tags:
      - Invoices
      summary: Update an invoice
      operationId: updateInvoice
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
            example:
              clientId: 98h687e29ae1f428e7ebe707
              companyId: 04g687e29ae1f428e7ebe123
              currency: USD
              discountPercent: 10.5
              dueDate: '2020-06-01T08:00:00Z'
              issuedDate: '2020-01-01T08:00:00Z'
              note: This is a sample note for this invoice.
              number: '202306121129'
              subject: January salary
              tax2Percent: 0
              taxPercent: 1.5
              taxType: SIMPLE
              visibleZeroFields:
              - TAX
              - TAX_2
              - DISCOUNT
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}/duplicate:
    post:
      tags:
      - Invoices
      summary: Duplicate an invoice
      operationId: duplicateInvoice
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      responses:
        '201':
          $ref: '#/components/responses/InvoiceDuplicatedResponse'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}/export:
    get:
      tags:
      - Invoices
      summary: Export an invoice
      operationId: exportInvoice
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      - $ref: '#/components/parameters/UserLocaleQuery'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceExportResponse'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}/items:
    post:
      tags:
      - Invoice items
      summary: Add item to an invoice
      operationId: addInvoiceItem
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInvoiceItemRequest'
            example:
              applyTaxes: TAX1TAX2
              description: This is a description of an invoice item.
              itemType: Service
              quantity: 10000
              unitPrice: 500
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}/items/import:
    post:
      tags:
      - Invoice items
      summary: Import time entries and expenses to an invoice
      operationId: importInvoiceItems
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportInvoiceItemsRequest'
            example:
              expenseFieldsForDetailedGroup:
              - NOTE
              expensesGroupBy: CATEGORY
              expensesGroupType: GROUPED
              from: '2025-06-01T00:00:00Z'
              importExpenses: false
              projectFilter:
                contains: CONTAINS
                ids:
                - 25b687e29ae1f428e7ebe123
                status: ACTIVE
              roundTimeEntryDuration: false
              timeEntryFieldsForDetailedGroup:
              - PROJECT
              - DESCRIPTION
              timeEntryGroupType: GROUPED
              timeEntryPrimaryGroupBy: PROJECT
              timeEntrySecondaryGroupBy: TASK
              to: '2025-06-07T00:00:00Z'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}/items/{order}:
    delete:
      tags:
      - Invoice items
      summary: Delete item from an invoice
      operationId: deleteInvoiceItem
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}/payments:
    get:
      tags:
      - Invoice payments
      summary: Get payments for an invoice
      operationId: getInvoicePayments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          $ref: '#/components/responses/InvoicePaymentsResponse'
    post:
      tags:
      - Invoice payments
      summary: Add payment to an invoice
      operationId: addInvoicePayment
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddInvoicePaymentRequest'
            example:
              amount: 100
              note: This is a sample note for this invoice payment.
              paymentDate: '2021-01-01T12:00:00Z'
      responses:
        '201':
          $ref: '#/components/responses/InvoiceDuplicatedResponse'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}/payments/{paymentId}:
    delete:
      tags:
      - Invoice payments
      summary: Delete payment from an invoice
      operationId: deleteInvoicePayment
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          $ref: '#/components/responses/InvoiceResponse'
  /v1/workspaces/{workspaceId}/invoices/{invoiceId}/status:
    patch:
      tags:
      - Invoices
      summary: Change an invoice status
      operationId: changeInvoiceStatus
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceStatusRequest'
            example:
              invoiceStatus: PAID
      responses:
        '200':
          $ref: '#/components/responses/Ok'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    AddonKeyAuth:
      type: apiKey
      in: header
      name: X-Addon-Key
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Represents a workspace identifier across the system.
      schema:
        type: string
        x-sourceDefault: '##default'
      example: 64a687e29ae1f428e7ebe303
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      description: Represents an invoice identifier across the system.
      schema:
        type: string
        x-sourceDefault: '##default'
      example: 78a687e29ae1f428e7ebe303
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: Represents a payment identifier across the system.
      schema:
        type: string
        x-sourceDefault: '##default'
      example: 56p687e29ae1f428e7ebe456
    Order:
      name: order
      in: path
      required: true
      description: Represents an invoice item order.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 3
    Page:
      name: page
      in: query
      required: false
      description: Page number.
      schema:
        type: integer
        format: int32
        default: 1
      example: 1
    PageSize:
      name: page-size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 50
      example: 50
    InvoiceStatusesQuery:
      name: statuses
      in: query
      required: false
      description: Filter invoices by one or more invoice statuses.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/InvoiceStatus'
      example:
      - UNSENT
      - PAID
    InvoiceSortColumnQuery:
      name: sort-column
      in: query
      required: false
      description: 'Valid column name as sorting criteria. Default: ID.'
      schema:
        $ref: '#/components/schemas/InvoiceSortColumn'
      example: CLIENT
    SortOrderQuery:
      name: sort-order
      in: query
      required: false
      description: 'Sort order. Default: ASCENDING.'
      schema:
        $ref: '#/components/schemas/SortOrder'
      example: ASCENDING
    UserLocaleQuery:
      name: userLocale
      in: query
      required: true
      description: Represents a locale.
      schema:
        type: string
        x-sourceDefault: '##default'
      example: en
  responses:
    Ok:
      description: OK
    InvoiceListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceListResponse'
          example:
            invoices: []
            total: 100
    InvoiceCreatedResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceCreateResponse'
          example:
            billFrom: Business X
            clientId: 34p687e29ae1f428e7ebe562
            currency: USD
            dueDate: '2020-06-01T08:00:00Z'
            id: 78a687e29ae1f428e7ebe303
            issuedDate: '2020-01-01T08:00:00Z'
            number: '202306121129'
    InvoiceInfoListResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceInfoListResponse'
          example:
            invoices: []
            total: 100
    InvoiceSettingsResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceSettingsResponse'
          example:
            defaults: {}
            exportFields: {}
            labels: {}
    InvoiceResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceDtoFull'
          example:
            amount: 100
            balance: 50
            billFrom: Business X
            calculationType: INVOICE_BASED
            clientAddress: Ground Floor, ABC Bldg., Palo Alto, California, USA 94020
            clientId: 98h687e29ae1f428e7ebe707
            clientName: Client X
            companyId: 04g687e29ae1f428e7ebe123
            containsImportedExpenses: false
            containsImportedTimes: false
            currency: USD
            discount: 10.5
            discountAmount: 11
            dueDate: '2020-06-01T08:00:00Z'
            id: 78a687e29ae1f428e7ebe303
            issuedDate: '2020-01-01T08:00:00Z'
            items: []
            note: This is a sample note for this invoice.
            number: '202306121129'
            paid: 50
            status: PAID
            subject: January salary
            subtotal: 5000
            tax: 1.5
            tax2: 0
            tax2Amount: 0
            taxAmount: 1
            taxType: SIMPLE
            userId: 12t687e29ae1f428e7ebe202
            visibleZeroFields:
            - TAX
            - TAX_2
            - DISCOUNT
    InvoiceDuplicatedResponse:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvoiceDtoFull'
          example:
            amount: 100
            balance: 50
            billFrom: Business X
            calculationType: INVOICE_BASED
            clientAddress: Ground Floor, ABC Bldg., Palo Alto, California, USA 94020
            clientId: 98h687e29ae1f428e7ebe707
            clientName: Client X
            companyId: 04g687e29ae1f428e7ebe123
            containsImportedExpenses: false
            containsImportedTimes: false
            currency: USD
            discount: 10.5
            discountAmount: 11
            dueDate: '2020-06-01T08:00:00Z'
            id: 78a687e29ae1f428e7ebe303
            issuedDate: '2020-01-01T08:00:00Z'
            items: []
            note: This is a sample note for this invoice.
            number: '202306121129'
            paid: 50
            status: PAID
            subject: January salary
            subtotal: 5000
            tax: 1.5
            tax2: 0
            tax2Amount: 0
            taxAmount: 1
            taxType: SIMPLE
            userId: 12t687e29ae1f428e7ebe202
            visibleZeroFields:
            - TAX
            - TAX_2
            - DISCOUNT
    InvoicePaymentsResponse:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/InvoicePaymentDto'
          example:
          - amount: 100
            author: John Doe
            date: '2021-01-01T12:00:00Z'
            id: 78a687e29ae1f428e7ebe303
            note: This is a sample note for this invoice payment.
    InvoiceExportResponse:
      description: OK
      content:
        '*/*':
          schema:
            type: string
            format: byte
        application/octet-stream:
          schema:
            type: string
            format: binary
  schemas:
    InvoiceStatus:
      type: string
      enum:
      - UNSENT
      - SENT
      - PAID
      - PARTIALLY_PAID
      - VOID
      - OVERDUE
      description: Represents the status of an invoice.
    InvoiceSortColumn:
      type: string
      enum:
      - ID
      - CLIENT
      - DUE_ON
      - ISSUE_DATE
      - AMOUNT
      - BALANCE
      description: Invoice sorting column.
    SortOrder:
      type: string
      enum:
      - ASCENDING
      - DESCENDING
      description: Sorting order.
    TaxType:
      type: string
      enum:
      - COMPOUND
      - SIMPLE
      - NONE
      description: Represents an invoice taxation type.
    CalculationType:
      type: string
      enum:
      - INVOICE_BASED
      - ITEM_BASED
      description: Represents whether tax is calculated as item based or invoice based.
    ApplyTaxes:
      type: string
      enum:
      - TAX1
      - TAX2
      - TAX1TAX2
      - NONE
      description: Represents item applyTaxes type.
    VisibleZeroFieldsInvoice:
      type: string
      enum:
      - TAX
      - TAX_2
      - DISCOUNT
      description: Represents a zero-value invoice field that will be visible.
    InvoiceImportType:
      type: string
      enum:
      - NOT_IMPORTED
      - TIME_ENTRY_IMPORT
      - EXPENSE_IMPORT
      description: Represents the invoice item import type.
    ContainsOperator:
      type: string
      enum:
      - CONTAINS
      - DOES_NOT_CONTAIN
      - CONTAINS_ONLY
      description: Filter type.
    EntityStatus:
      type: string
      enum:
      - ACTIVE
      - ARCHIVED
      - ALL
      description: Filters entities by status.
    TimeViewMode:
      type: string
      enum:
      - TIME_SENSITIVE_VIEW
      - AGGREGATED_TIME_VIEW
    ExpenseFieldsForDetailedGroup:
      type: string
      enum:
      - PROJECT
      - TASK
      - CATEGORY
      - NOTE
      - DATE
      - USER
    ExpensesGroupBy:
      type: string
      enum:
      - CATEGORY
      - PROJECT
      - USER
    ExpensesGroupType:
      type: string
      enum:
      - GROUPED
      - DETAILED
    TimeEntryFieldsForDetailedGroup:
      type: string
      enum:
      - PROJECT
      - TASK
      - TAGS
      - DESCRIPTION
      - DATE
      - USER
    TimeEntryGroupType:
      type: string
      enum:
      - SINGLE_ITEM
      - GROUPED
      - DETAILED
    TimeEntryPrimaryGroupBy:
      type: string
      enum:
      - USER
      - PROJECT
      - DATE
    TimeEntrySecondaryGroupBy:
      type: string
      enum:
      - PROJECT
      - USER
      - TASK
      - DATE
      - DESCRIPTION
      - NONE
    ContainsArchivedFilterRequest:
      type: object
      description: Represents a filter for imported items that can include archived
        entities.
      properties:
        contains:
          $ref: '#/components/schemas/ContainsOperator'
        ids:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Represents a list of filter identifiers.
        status:
          $ref: '#/components/schemas/EntityStatus'
    BaseFilterRequest:
      type: object
      description: Represents a base filter object.
      properties:
        contains:
          $ref: '#/components/schemas/ContainsOperator'
        ids:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Represents a list of filter identifiers.
    TimeRangeRequestDtoV1:
      type: object
      description: Represents a time range object for invoice issue dates.
      properties:
        issue-date-start:
          type: string
          description: Represents a date in yyyy-MM-dd format.
          default: '##default'
          example: '2024-01-01'
        issue-date-end:
          type: string
          description: Represents a date in yyyy-MM-dd format.
          default: '##default'
          example: '2024-12-31'
    InvoiceDtoV1:
      type: object
      description: Represents an invoice summary.
      properties:
        amount:
          type: integer
          format: int64
          description: Represents an invoice amount as long.
        balance:
          type: integer
          format: int64
          description: Represents an invoice balance amount as long.
        clientId:
          type: string
          description: Represents client identifier across the system.
          default: '##default'
        clientName:
          type: string
          description: Represents client name for an invoice.
          default: '##default'
        currency:
          type: string
          description: Represents the currency used by the invoice.
          default: '##default'
        dueDate:
          type: string
          format: date-time
          description: Represents an invoice due date in yyyy-MM-ddThh:mm:ssZ format.
        id:
          type: string
          description: Represents invoice identifier across the system.
          default: '##default'
        issuedDate:
          type: string
          format: date-time
          description: Represents an invoice issued date in yyyy-MM-ddThh:mm:ssZ format.
        number:
          type: string
          description: Represents an invoice number.
          default: '##default'
        paid:
          type: integer
          format: int64
          description: Represents an invoice paid amount as long.
        status:
          $ref: '#/components/schemas/InvoiceStatus'
    InvoiceListResponse:
      type: object
      properties:
        invoices:
          type: array
          description: Represents a list of invoices.
          items:
            $ref: '#/components/schemas/InvoiceDtoV1'
          x-sourceDefault: '##default'
        total:
          type: integer
          format: int64
          description: Represents the total invoice count.
    InvoiceCreateRequest:
      type: object
      required:
      - clientId
      - currency
      - dueDate
      - issuedDate
      - number
      properties:
        clientId:
          type: string
          description: Represents a client identifier across the system.
          default: '##default'
          minLength: 1
        currency:
          type: string
          description: Represents the currency used by the invoice.
          default: '##default'
          minLength: 1
        dueDate:
          type: string
          format: date-time
          description: Represents an invoice due date in yyyy-MM-ddThh:mm:ssZ format.
        issuedDate:
          type: string
          format: date-time
          description: Represents an invoice issued date in yyyy-MM-ddThh:mm:ssZ format.
        number:
          type: string
          description: Represents an invoice number.
          default: '##default'
          minLength: 1
        timeViewMode:
          $ref: '#/components/schemas/TimeViewMode'
      example:
        clientId: 34p687e29ae1f428e7ebe562
        currency: USD
        dueDate: '2020-06-01T08:00:00Z'
        issuedDate: '2020-01-01T08:00:00Z'
        number: '202306121129'
        timeViewMode: AGGREGATED_TIME_VIEW
