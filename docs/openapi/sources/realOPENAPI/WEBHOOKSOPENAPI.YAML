      type: object
      properties:
        webhooks:
          type: array
          description: Represents a list of webhook objects for the workspace.
          items:
            $ref: '#/components/schemas/WebhookDtoV1'
          x-sourceDefault: '##default'
        workspaceWebhookCount:
          type: integer
          format: int32
          description: Represents number of webhooks for the workspace.
          example: 5
    WebhookDtoV1:
      type: object
      properties:
        authToken:
          type: string
          description: Represents an authentication token.
          x-sourceDefault: '##default'
        deliveryEnabled:
          type: boolean
          description: Indicates whether webhook delivery is enabled or not. It can be disabled if delivery failed for too
            many times.
          default: false
        enabled:
          type: boolean
          description: Indicates whether webhook is enabled or not.
          default: false
        id:
          type: string
          description: Represents webhook identifier across the system.
          x-sourceDefault: '##default'
        name:
          type: string
          description: Represents webhook name.
          x-sourceDefault: '##default'
        planEnabled:
          type: boolean
          description: Indicates whether webhook is supported by current plan. It can be disabled if number of webhooks exceeds
            plan limit or if the feature is not supported on current plan.
          default: false
        triggerSource:
          type: array
          description: Represents a list of trigger sources.
          items:
            type: string
          x-sourceDefault: '##default'
        triggerSourceType:
          $ref: '#/components/schemas/WebhookEventTriggerSourceType'
        entityType:
          $ref: '#/components/schemas/WebhookEntityType'
        url:
          type: string
          description: Represents a webhook target URL.
          format: uri
          x-sourceDefault: '##default'
        userId:
          type: string
          description: Represents user identifier across the system.
          x-sourceDefault: '##default'
        webhookEvent:
          $ref: '#/components/schemas/WebhookEventType'
        feature:
          $ref: '#/components/schemas/Feature'
        payloadType:
          $ref: '#/components/schemas/WebhookPayloadType'
        validSourceTypes:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventTriggerSourceType'
        workspaceId:
          type: string
          description: Represents workspace identifier across the system.
          x-sourceDefault: '##default'
    WebhookRequest:
      type: object
      required:
      - name
      - triggerSource
      - triggerSourceType
      - url
      - webhookEvent
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 30
          description: Represents a webhook name.
          x-sourceDefault: '##default'
        triggerSource:
          type: array
          description: Represents a list of trigger sources.
          items:
            type: string
          x-sourceDefault: '##default'
        triggerSourceType:
          $ref: '#/components/schemas/WebhookEventTriggerSourceType'
        url:
          type: string
          minLength: 1
          description: Represents a webhook target url.
          format: uri
          x-sourceDefault: '##default'
        webhookEvent:
          $ref: '#/components/schemas/WebhookEventType'
    WebhookLogsRequest:
      type: object
      properties:
        from:
          type: string
          format: date-time
          description: Represents date and time in yyyy-MM-ddThh:mm:ssZ format. If provided, results will include logs which
            occurred after this value.
        sortByNewest:
          type: boolean
          description: If set to true, logs will be sorted with most recent first.
          default: false
        status:
          type: string
          description: Filters logs by status.
          enum:
          - ALL
          - SUCCEEDED
          - FAILED
          x-sourceDefault: '##default'
        to:
          type: string
          format: date-time
          description: Represents date and time in yyyy-MM-ddThh:mm:ssZ format. If provided, results will include logs which
            occurred before this value.
    WebhookLogDtoV1:
      type: object
      properties:
        id:
          type: string
          description: Represents log identifier across the system.
          x-sourceDefault: '##default'
        requestBody:
          type: string
          description: Represents request body.
          x-sourceDefault: '##default'
        respondedAt:
          type: string
          description: Represents date and time of response.
          format: date-time
          x-sourceDefault: '##default'
        responseBody:
          type: string
          description: Represents response body.
          x-sourceDefault: '##default'
        statusCode:
          type: integer
          format: int32
          description: Represents response status code.
        webhookEventStatusId:
          type: string
          description: Represents webhook event status identifier across the system.
          x-sourceDefault: '##default'
        webhookId:
          type: string
          description: Represents webhook identifier across the system.
          x-sourceDefault: '##default'
x-incompleteOperations:
- title: Generate a new token
  description: Generates a new webhook token and invalidates previous one.
  reason: The source Markdown includes this section but does not include an HTTP method or path, so it cannot be represented
    as an OpenAPI path operation without inventing information.
  pathParameters:
  - workspaceId
  - webhookId
  responseSchema: '#/components/schemas/WebhookDtoV1'
