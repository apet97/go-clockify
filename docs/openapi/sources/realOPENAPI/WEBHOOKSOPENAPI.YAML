openapi: 3.0.3
info:
  title: Clockify Webhooks API
  version: 1.0.0
  description: OpenAPI specification generated from the provided WEBHOOKDOC.md Markdown file.
servers:
- url: https://api.clockify.me/api
  description: Clockify API base URL
security:
- ApiKeyAuth: []
- AddonKeyAuth: []
tags:
- name: Webhooks
  description: Webhook management and webhook log endpoints.
paths:
  /v1/workspaces/{workspaceId}/addons/{addonId}/webhooks:
    get:
      tags:
      - Webhooks
      summary: Get all webhooks for addon on a workspace
      operationId: getAddonWebhooksOnWorkspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AddonId'
      responses:
        '200':
          $ref: '#/components/responses/WebhookCollectionResponse'
  /v1/workspaces/{workspaceId}/webhooks:
    get:
      tags:
      - Webhooks
      summary: Get all webhooks on a workspace
      operationId: getWebhooksOnWorkspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: type
        in: query
        required: false
        description: Represents a webhook type.
        schema:
          $ref: '#/components/schemas/WebhookType'
        example: USER_CREATED
      responses:
        '200':
          $ref: '#/components/responses/WebhookCollectionResponse'
    post:
      tags:
      - Webhooks
      summary: Create a webhook
      description: Creating a webhook generates a new token which can be used to verify that the webhook being sent was sent
        by Clockify, as it will always be present in the header.
      operationId: createWebhook
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            example:
              name: Stripe
              triggerSource:
              - 54a687e29ae1f428e7ebe909
              - 87p187e29ae1f428e7ebej56
              triggerSourceType: PROJECT_ID
              url: https://example-clockify.com/stripeEndpoint
              webhookEvent: NEW_PROJECT
      responses:
        '201':
          $ref: '#/components/responses/WebhookResponseCreated'
  /v1/workspaces/{workspaceId}/webhooks/{webhookId}:
    delete:
      tags:
      - Webhooks
      summary: Delete a webhook
      operationId: deleteWebhook
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          description: OK
    get:
      tags:
      - Webhooks
      summary: Get a specific webhook by ID
      operationId: getWebhookById
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WebhookId'
      responses:
        '200':
          $ref: '#/components/responses/WebhookResponse'
    put:
      tags:
      - Webhooks
      summary: Update a webhook
      operationId: updateWebhook
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
            example:
              name: Stripe
              triggerSource:
              - 54a687e29ae1f428e7ebe909
              - 87p187e29ae1f428e7ebej56
              triggerSourceType: PROJECT_ID
              url: https://example-clockify.com/stripeEndpoint
              webhookEvent: NEW_PROJECT
      responses:
        '200':
          $ref: '#/components/responses/WebhookResponse'
  /v1/workspaces/{workspaceId}/webhooks/{webhookId}/logs:
    post:
      tags:
      - Webhooks
      summary: Get logs for a webhook
      operationId: getWebhookLogs
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WebhookId'
      - name: page
        in: query
        required: false
        description: Page number.
        schema:
          type: integer
          format: int32
          default: 0
        example: 1
      - name: size
        in: query
        required: false
        description: Page size.
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 50
        example: 50
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookLogsRequest'
            example:
              from: '2023-02-01T13:00:46Z'
              sortByNewest: false
              status: ALL
              to: '2023-02-05T13:00:46Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookLogDtoV1'
              example:
              - id: 65e5b854fe0dfa24f1528ef0
                requestBody: '{"id":"65df50f5d2dd8f23a685374e","name":"Webhook"}'
                respondedAt: '2024-03-04T12:02:28.125+00:00'
                responseBody: '{"id":"h73210f5d2dd8f23685374e","response":"Webhook response"}'
                statusCode: 200
                webhookEventStatusId: 6818c52b391aca499bf8dafc
                webhookId: 65df5508d2dd8f23a68537af
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    AddonKeyAuth:
      type: apiKey
      in: header
      name: X-Addon-Key
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Represents a workspace identifier across the system.
      schema:
        type: string
        x-sourceDefault: '##default'
      example: 64a687e29ae1f428e7ebe303
    AddonId:
      name: addonId
      in: path
      required: true
      description: Represents an addon identifier across the system.
      schema:
        type: string
        x-sourceDefault: '##default'
      example: 64c777ddd3fcab07cfbb210c
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Represents a webhook identifier across the system.
      schema:
        type: string
        x-sourceDefault: '##default'
      example: 5b715448b0798751107918ab
  responses:
    WebhookCollectionResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookCollectionDtoV1'
          example:
            webhooks:
            - authToken: ""
              deliveryEnabled: false
              enabled: false
              id: 76a687e29ae1f428e7ebe101
              name: stripe
              planEnabled: false
              triggerSource:
              - 54a687e29ae1f428e7ebe909
              - 87p187e29ae1f428e7ebej56
              triggerSourceType: PROJECT_ID
              url: https://example-clockify.com/stripeEndpoint
              userId: 5a0ab5acb07987125438b60f
              webhookEvent: NEW_PROJECT
              workspaceId: 64a687e29ae1f428e7ebe303
            workspaceWebhookCount: 5
    WebhookResponse:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookDtoV1'
          example:
            authToken: ""
            deliveryEnabled: false
            enabled: false
            id: 76a687e29ae1f428e7ebe101
            name: stripe
            planEnabled: false
            triggerSource:
            - 54a687e29ae1f428e7ebe909
            - 87p187e29ae1f428e7ebej56
            triggerSourceType: PROJECT_ID
            url: https://example-clockify.com/stripeEndpoint
            userId: 5a0ab5acb07987125438b60f
            webhookEvent: NEW_PROJECT
            workspaceId: 64a687e29ae1f428e7ebe303
    WebhookResponseCreated:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookDtoV1'
          example:
            authToken: ""
            deliveryEnabled: false
            enabled: false
            id: 76a687e29ae1f428e7ebe101
            name: stripe
            planEnabled: false
            triggerSource:
            - 54a687e29ae1f428e7ebe909
            - 87p187e29ae1f428e7ebej56
            triggerSourceType: PROJECT_ID
            url: https://example-clockify.com/stripeEndpoint
            userId: 5a0ab5acb07987125438b60f
            webhookEvent: NEW_PROJECT
            workspaceId: 64a687e29ae1f428e7ebe303
  schemas:
    WebhookType:
      type: string
      enum:
      - USER_CREATED
      - SYSTEM
      - ADDON
    WebhookEventTriggerSourceType:
      type: string
      enum:
      - PROJECT_ID
      - USER_ID
      - TAG_ID
      - TASK_ID
      - WORKSPACE_ID
      - ASSIGNMENT_ID
      - EXPENSE_ID
    WebhookEventType:
      type: string
      enum:
      - NEW_PROJECT
      - NEW_TASK
      - NEW_CLIENT
      - NEW_TIMER_STARTED
      - TIMER_STOPPED
      - TIME_ENTRY_UPDATED
      - TIME_ENTRY_DELETED
      - TIME_ENTRY_SPLIT
      - NEW_TIME_ENTRY
      - TIME_ENTRY_RESTORED
      - NEW_TAG
      - USER_DELETED_FROM_WORKSPACE
      - USER_JOINED_WORKSPACE
      - USER_DEACTIVATED_ON_WORKSPACE
      - USER_ACTIVATED_ON_WORKSPACE
      - USER_EMAIL_CHANGED
      - USER_UPDATED
      - NEW_INVOICE
      - INVOICE_UPDATED
      - NEW_APPROVAL_REQUEST
      - APPROVAL_REQUEST_STATUS_UPDATED
      - TIME_OFF_REQUESTED
      - TIME_OFF_REQUEST_UPDATED
      - TIME_OFF_REQUEST_APPROVED
      - TIME_OFF_REQUEST_REJECTED
      - TIME_OFF_REQUEST_STARTED
      - TIME_OFF_REQUEST_WITHDRAWN
      - BALANCE_UPDATED
      - TAG_UPDATED
      - TAG_DELETED
      - TASK_UPDATED
      - CLIENT_UPDATED
      - TASK_DELETED
      - CLIENT_DELETED
      - EXPENSE_RESTORED
      - ASSIGNMENT_CREATED
      - ASSIGNMENT_DELETED
      - ASSIGNMENT_PUBLISHED
      - ASSIGNMENT_UPDATED
      - EXPENSE_CREATED
      - EXPENSE_DELETED
      - EXPENSE_UPDATED
      - PROJECT_UPDATED
      - PROJECT_DELETED
      - USER_GROUP_CREATED
      - USER_GROUP_UPDATED
      - USER_GROUP_DELETED
      - USERS_INVITED_TO_WORKSPACE
      - LIMITED_USERS_ADDED_TO_WORKSPACE
      - COST_RATE_UPDATED
      - BILLABLE_RATE_UPDATED
    WebhookEntityType:
      type: string
      enum:
      - AUTH
      - ALERT
      - APPROVAL_REQUEST
      - ASSIGNMENT
      - CLIENT
      - DOMAIN
      - EXPENSE
      - EXPENSE_CATEGORY
      - EXPORT_SETTINGS
      - INVOICE
      - INVOICE_RECURRING_SETTINGS
      - INVOICE_REMINDERS
      - INVOICE_REMINDERS_INTERVALS
      - INVOICE_ITEM_TYPE
      - PASSWORD_RESET_TOKEN
      - PROJECT
      - PROJECT_FAVORITE
      - REMINDER
      - REPORT
      - ORGANIZATION
      - TEMPLATE
      - TIMEENTRY
      - TIMEENTRY_RATE
      - TAG
      - TASK
      - TASK_FAVORITES
      - USER
      - WORKSPACE_USER
      - USER_GROUP
      - WEBHOOK
      - WORKSPACE
      - CUSTOM_FIELD
