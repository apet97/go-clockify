openapi: 3.0.3
info:
  title: Clockify Projects API
  version: 1.0.0
  description: OpenAPI definition generated from PROJECTSDOC.md. It covers Clockify project listing, creation, templates,
    project detail, estimates, memberships, and project user rate endpoints described in the source Markdown.
servers:
- url: https://api.clockify.me/api
  description: Clockify API
tags:
- name: Projects
  description: Project management operations.
paths:
  /v1/workspaces/{workspaceId}/projects:
    get:
      tags:
      - Projects
      operationId: getWorkspaceProjects
      summary: Get all projects on a workspace
      security:
      - ApiKeyAuth: []
      - AddonKeyAuth: []
      parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
        description: Represents a workspace identifier across the system.
        example: 64a687e29ae1f428e7ebe303
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: If provided, returns projects whose name contains the provided string.
        example: Software Development
      - name: strict-name-search
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, search by name returns only projects whose name exactly matches the name parameter.
        example: false
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: If true, returns only archived projects. If omitted, returns both archived and non-archived projects.
        example: false
      - name: billable
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: If true, returns only billable projects. If omitted, returns both billable and non-billable projects.
        example: false
      - name: clients
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: If provided, returns projects that contain clients matching any provided ids.
        example:
        - 5a0ab5acb07987125438b60f
        - 64c777ddd3fcab07cfbb210c
        style: form
        explode: true
      - name: contains-client
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Controls whether the clients filter includes or excludes matching client ids.
        example: true
      - name: client-status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - ALL
        description: Filters projects based on client status.
        example: ACTIVE
      - name: users
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: If provided, returns projects that contain users matching any provided ids.
        example:
        - 5a0ab5acb07987125438b60f
        - 64c777ddd3fcab07cfbb210c
        style: form
        explode: true
      - name: contains-user
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Controls whether the users filter includes or excludes matching user ids.
        example: true
      - name: user-status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DECLINED
          - INACTIVE
          - ALL
        description: Filters projects based on user status.
        example: ALL
      - name: is-template
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Filters projects based on whether they are used as a template or not.
        example: false
      - name: sort-column
        in: query
        required: false
        schema:
          type: string
          enum:
          - ID
          - NAME
          - CLIENT_NAME
          - DURATION
          - BUDGET
          - PROGRESS
        description: Sorts the results by the given column/field.
        example: NAME
      - name: sort-order
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASCENDING
          - DESCENDING
        description: Sorting mode.
        example: ASCENDING
      - name: hydrated
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: If true, results contain additional information about the project.
        example: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
        description: Page number.
        example: 1
      - name: page-size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 50
        description: Page size.
        example: 50
      - name: access
        in: query
        required: false
        schema:
          type: string
          enum:
          - PUBLIC
          - PRIVATE
        description: If provided, returns projects that match the provided access.
        example: PUBLIC
      - name: expense-limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
        description: Represents the maximum number of expenses to fetch.
        example: 10
      - name: expense-date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: If provided, returns expenses dated before the provided yyyy-MM-dd date.
        example: '2024-12-31'
      - name: userGroups
        in: query
        required: false
        schema:
          type: array
          uniqueItems: true
          items:
            type: string
        description: If provided, returns projects that contain groups matching any provided ids.
        example:
        - 5a0ab5acb07987125438b60f
        - 64c777ddd3fcab07cfbb210c
        style: form
        explode: true
      - name: contains-group
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Controls whether the userGroups filter includes or excludes matching group ids.
        example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              example:
              - archived: false
                billable: false
                budgetEstimate:
                  active: true
                  estimate: 10000
                  includeExpenses: false
                  resetOption: MONTHLY
                  type: AUTO
                clientId: 9t641568b07987035750704
                clientName: Client X
                color: '#000000'
                costRate:
                  amount: 20000
                  currency: USD
                duration: '60000'
                estimate:
                  estimate: PT1H30M
                  type: AUTO
                estimateReset:
                  dayOfMonth: 1
                  dayOfWeek: MONDAY
                  hour: 0
                  interval: MONTHLY
                  month: JANUARY
                hourlyRate:
                  amount: 20000
                  currency: USD
                id: 5b641568b07987035750505e
                memberships:
                - costRate:
                    amount: 20000
                    currency: USD
                  hourlyRate:
                    amount: 20000
                    currency: USD
                  membershipStatus: ACTIVE
                  membershipType: PROJECT
                  targetId: 5b641568b07987035750505e
                  userId: 45b687e29ae1f428e7ebe123
                name: Software Development
                note: This is a sample note for the project.
                public: false
                template: false
                timeEstimate:
                  active: true
                  estimate: PT1H30M
                  includeNonBillable: false
                  resetOption: MONTHLY
                  type: AUTO
                workspaceId: 64a687e29ae1f428e7ebe303
