components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clockify API key.
    AddonKeyAuth:
      type: apiKey
      in: header
      name: X-Addon-Key
      description: Addon key authorization.
  schemas:
    RateDtoV1:
      type: object
      description: Represents an hourly or cost rate object.
      properties:
        amount:
          type: integer
          format: int32
          description: Represents an amount as integer.
        currency:
          type: string
          description: Represents a currency.
      additionalProperties: false
    RateRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: integer
          format: int32
          minimum: 0
          description: Represents an amount as integer.
        since:
          type: string
          format: date-time
          description: Represents a date and time in yyyy-MM-ddThh:mm:ssZ format.
      additionalProperties: false
    EstimateDtoV1:
      type: object
      description: Represents a project estimate object.
      properties:
        estimate:
          type: string
          description: Represents a task duration estimate.
        type:
          type: string
          enum:
          - AUTO
          - MANUAL
          description: Represents an estimate type enum.
      additionalProperties: false
    EstimateRequest:
      type: object
      description: Represents an estimate request object.
      properties:
        estimate:
          type: string
          description: Represents a time duration in ISO-8601 format.
        type:
          type: string
          enum:
          - AUTO
          - MANUAL
          description: Represents an estimate type enum.
      additionalProperties: false
    EstimateWithOptionsDto:
      type: object
      description: Represents a project budget estimate object.
      properties:
        active:
          type: boolean
        estimate:
          type: integer
          format: int64
          description: Represents an estimate as long.
        includeExpenses:
          type: boolean
          default: false
          description: Indicates whether estimate includes expenses.
        resetOption:
          type: string
          enum:
          - WEEKLY
          - MONTHLY
          - YEARLY
          description: Represents a reset option enum.
        type:
          type: string
          enum:
          - AUTO
          - MANUAL
          description: Represents an estimate type enum.
      additionalProperties: false
    EstimateWithOptionsRequest:
      type: object
      description: Represents estimate with options request object.
      properties:
        active:
          type: boolean
          default: false
          description: Flag whether to set estimate as active or not.
        estimate:
          type: integer
          format: int64
          minimum: 0
          description: Represents an estimate as long.
        includeExpenses:
          type: boolean
          default: false
          description: Flag whether to include billable expenses.
        resetOption:
          type: string
          enum:
          - WEEKLY
          - MONTHLY
          - YEARLY
          description: Represents a reset option enum.
        type:
          type: string
          enum:
          - AUTO
          - MANUAL
          description: Represents an estimate type enum.
      additionalProperties: false
    EstimateResetDto:
      type: object
      description: Represents project estimate reset object.
      properties:
        dayOfMonth:
          type: integer
          format: int32
        dayOfWeek:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
        hour:
          type: integer
          format: int32
        interval:
          type: string
          enum:
          - WEEKLY
          - MONTHLY
          - YEARLY
        month:
          type: string
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
      additionalProperties: false
    EstimateResetRequest:
      type: object
      description: Represents estimate reset request object.
      properties:
        active:
          type: boolean
        dayOfMonth:
          type: integer
          format: int32
          minimum: 1
          maximum: 31
          description: Represents a day of the month.
        dayOfWeek:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          description: Represents a day of the week.
        hour:
          type: integer
          format: int32
          minimum: 0
          maximum: 23
          description: Represents an hour of the day in 24-hour time format.
        interval:
          type: string
          enum:
          - WEEKLY
          - MONTHLY
          - YEARLY
          description: Represents a reset option enum.
        isActive:
          type: boolean
        month:
          type: string
          enum:
          - JANUARY
          - FEBRUARY
          - MARCH
          - APRIL
          - MAY
          - JUNE
          - JULY
          - AUGUST
          - SEPTEMBER
          - OCTOBER
          - NOVEMBER
          - DECEMBER
          description: Represents a month enum.
      additionalProperties: false
    TimeEstimateDto:
      type: object
      description: Represents a project time estimate object.
      properties:
        active:
          type: boolean
        estimate:
          type: string
          description: Represents project duration in milliseconds or ISO-8601 duration.
        includeNonBillable:
          type: boolean
        resetOption:
          type: string
          enum:
          - WEEKLY
          - MONTHLY
          - YEARLY
        type:
          type: string
          enum:
          - AUTO
          - MANUAL
      additionalProperties: false
    TimeEstimateRequest:
      type: object
      description: Represents project time estimate request object.
      properties:
        active:
          type: boolean
          default: false
          description: Flag whether to include only active or inactive estimates.
        estimate:
          type: string
          description: Represents a time duration in ISO-8601 format.
        includeNonBillable:
          type: boolean
          default: false
          description: Flag whether to include non-billable expenses.
        resetOption:
          type: string
          enum:
          - WEEKLY
          - MONTHLY
          - YEARLY
        type:
          type: string
          enum:
          - AUTO
          - MANUAL
      additionalProperties: false
    MembershipDtoV1:
      type: object
      description: Represents a membership object.
      properties:
        costRate:
          $ref: '#/components/schemas/RateDtoV1'
        hourlyRate:
          $ref: '#/components/schemas/RateDtoV1'
        membershipStatus:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DECLINED
          - INACTIVE
          - ALL
          description: Represents a membership status enum.
        membershipType:
          type: string
          enum:
          - WORKSPACE
          - PROJECT
          - USERGROUP
          description: Represents membership type enum.
        targetId:
          type: string
          description: Represents target identifier across the system.
        userId:
          type: string
          description: Represents user identifier across the system.
      additionalProperties: false
    MembershipRequest:
      type: object
      description: Represents a membership request object.
      properties:
        hourlyRate:
          $ref: '#/components/schemas/RateRequest'
        membershipStatus:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DECLINED
          - INACTIVE
          - ALL
        membershipType:
          type: string
          enum:
          - WORKSPACE
          - PROJECT
          - USERGROUP
        userId:
          type: string
          description: Represents user identifier across the system.
      additionalProperties: false
    UserIdWithRatesRequest:
      type: object
      required:
      - userId
      description: Represents a user id with cost and hourly rates.
      properties:
        costRate:
          $ref: '#/components/schemas/RateRequest'
        hourlyRate:
          $ref: '#/components/schemas/RateRequest'
        userId:
          type: string
          description: Represents user identifier across the system.
      additionalProperties: false
    UserGroupIdsSchema:
      type: object
      description: Provide list with user group ids and corresponding status.
      properties:
        contains:
          type: string
          enum:
          - CONTAINS
          - DOES_NOT_CONTAIN
        ids:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Represents ids upon which filtering is performed.
        status:
          type: string
          enum:
          - ALL
          - ACTIVE
          - INACTIVE
          description: Represents user status.
      additionalProperties: false
    TaskRequest:
      type: object
      description: Represents a task request object used when creating a project.
      required:
      - name
      properties:
        assigneeId:
          type: string
          deprecated: true
        assigneeIds:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Represents list of assignee ids for the task.
        billable:
          type: boolean
          default: false
          description: Flag to set whether task is billable or not.
        budgetEstimate:
          type: integer
          format: int64
          minimum: 0
        costRate:
          $ref: '#/components/schemas/RateRequest'
        estimate:
          type: string
          description: Represents a task duration estimate.
        hourlyRate:
          $ref: '#/components/schemas/RateRequest'
        id:
          type: string
          description: Represents task identifier across the system.
        name:
          type: string
          description: Represents task name.
        projectId:
          type: string
          description: Represents project identifier across the system.
        status:
          type: string
          enum:
          - ACTIVE
          - DONE
          - ALL
          description: Represents task status.
        userGroupIds:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Represents list of user group ids for the task.
      additionalProperties: false
    Project:
      type: object
      description: Represents a Clockify project.
      properties:
        archived:
          type: boolean
          default: false
          description: Indicates whether project is archived or not.
        billable:
          type: boolean
          default: false
          description: Indicates whether project is billable or not.
        budgetEstimate:
          $ref: '#/components/schemas/EstimateWithOptionsDto'
        clientId:
          type: string
          description: Represents client identifier across the system.
        clientName:
