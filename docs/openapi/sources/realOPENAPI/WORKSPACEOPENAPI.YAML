openapi: 3.0.3
info:
  title: Clockify Workspaces API
  version: 1.0.0
  description: OpenAPI definition generated from WORKSPACESDOC.md. It covers the Workspaces endpoints, request parameters,
    request bodies, and response schemas described in the source Markdown.
servers:
- url: https://api.clockify.me/api
  description: Clockify API
tags:
- name: Workspaces
  description: Workspace management operations.
paths:
  /v1/workspaces:
    get:
      tags:
      - Workspaces
      operationId: getAllMyWorkspaces
      summary: Get all my workspaces
      description: Returns the current user's workspaces. Optionally filters workspaces by role.
      security:
      - MarketplaceKeyAuth: []
      - ApiKeyAuth: []
      parameters:
      - name: roles
        in: query
        required: false
        description: If provided, returns workspaces where the user has any of the specified roles. Owners are not counted
          as admins when filtering.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - WORKSPACE_ADMIN
            - OWNER
            - TEAM_MANAGER
            - PROJECT_MANAGER
        example:
        - WORKSPACE_ADMIN
        - OWNER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
              example:
              - cakeOrganizationId: 67d471fb56aa9668b7bfa295
                costRate:
                  amount: 20000
                  currency: USD
                currencies:
                - code: USD
                  id: 33t687e29ae1f428e7ebe505
                  isDefault: true
                featureSubscriptionType: STANDARD_2021
                features:
                - ADD_TIME_FOR_OTHERS
                - ADMIN_PANEL
                - ALERTS
                - APPROVAL
                hourlyRate:
                  amount: 2000
                  currency: USD
                id: 64a687e29ae1f428e7ebe303
                imageUrl: https://www.url.com/imageurl-1234567890.jpg
                memberships: []
                name: Cool Company
                subdomain:
                  enabled: false
                  name: cool-company
                workspaceSettings:
                  durationFormat: FULL
                  workingDays:
                  - MONDAY
                  - TUESDAY
                  - WEDNESDAY
                  - THURSDAY
                  - FRIDAY
    post:
      tags:
      - Workspaces
      operationId: addWorkspace
      summary: Add a workspace
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
            example:
              name: Cool Company
              organizationId: 67d471fb56aa9668b7bfa295
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              example:
                cakeOrganizationId: 67d471fb56aa9668b7bfa295
                costRate:
                  amount: 20000
                  currency: USD
                currencies:
                - code: USD
                  id: 33t687e29ae1f428e7ebe505
                  isDefault: true
                featureSubscriptionType: STANDARD_2021
                features:
                - ADD_TIME_FOR_OTHERS
                - ADMIN_PANEL
                - ALERTS
                - APPROVAL
                hourlyRate:
                  amount: 2000
                  currency: USD
                id: 64a687e29ae1f428e7ebe303
                imageUrl: https://www.url.com/imageurl-1234567890.jpg
                memberships: []
                name: Cool Company
                subdomain:
                  enabled: false
                  name: cool-company
                workspaceSettings:
                  durationFormat: FULL
                  workingDays:
                  - MONDAY
                  - TUESDAY
                  - WEDNESDAY
                  - THURSDAY
                  - FRIDAY
