  /v1/workspaces/{workspaceId}/users:
    post:
      tags:
      - Workspaces
      operationId: addUserToWorkspace
      summary: Add user to a workspace
      description: Adds a user to a workspace. The source documentation notes that adding users via API is available only
        if the workspace has a paid subscription and is limited by the number of paid user seats.
      security:
      - ApiKeyAuth: []
      - AddonKeyAuth: []
      parameters:
      - name: workspaceId
        in: path
        required: true
        description: Represents a workspace identifier across the system.
        schema:
          type: string
          example: 64a687e29ae1f428e7ebe303
      - name: send-email
        in: query
        required: true
        description: Indicates whether to send an email when user is added to the workspace.
        schema:
          type: string
          default: 'true'
          enum:
          - 'true'
          - 'false'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserToWorkspaceRequest'
            example:
              email: johndoe@example.com
