components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clockify API key.
    AddonKeyAuth:
      type: apiKey
      in: header
      name: X-Addon-Key
      description: Addon key authorization.
    MarketplaceKeyAuth:
      type: apiKey
      in: header
      name: X-Marketplace-Key
      description: Marketplace key authorization.
  schemas:
    CreateWorkspaceRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Represents a workspace name.
        organizationId:
          type: string
          description: Represents the Cake organization identifier across the system.
      additionalProperties: false
    UpdateCostRateRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: integer
          format: int32
          minimum: 0
          description: Represents an amount as integer.
        since:
          type: string
          description: Represents a date and time in yyyy-MM-ddThh:mm:ssZ format.
          example: '2020-01-01T00:00:00Z'
      additionalProperties: false
    UpdateWorkspaceBillableRateRequest:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          format: int32
          minimum: 0
          description: Represents an amount as integer.
        currency:
          type: string
          minLength: 1
          maxLength: 100
          default: USD
          description: Represents a currency.
        since:
          type: string
          description: Represents a date and time in yyyy-MM-ddThh:mm:ssZ format.
          example: '2020-01-01T00:00:00Z'
      additionalProperties: false
    AddUserToWorkspaceRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Represents an email address of the user.
      additionalProperties: false
    UpdateUserStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          description: Represents membership status.
      additionalProperties: false
    UpdateUserHourlyRateRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: integer
          format: int32
          minimum: 0
          description: Represents an hourly rate amount as integer.
        since:
          type: string
          description: Represents a date and time in yyyy-MM-ddThh:mm:ssZ format.
          example: '2020-01-01T00:00:00Z'
      additionalProperties: false
    Workspace:
      type: object
      description: Workspace object.
      properties:
        cakeOrganizationId:
          type: string
          description: Represents the Cake organization identifier across the system.
        costRate:
          $ref: '#/components/schemas/RateDtoV1'
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyWithDefaultInfoDtoV1'
        featureSubscriptionType:
          type: string
          description: Represents a feature plan type enum.
          example: STANDARD_2021
        features:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
          description: Represents a list of features.
        hourlyRate:
          $ref: '#/components/schemas/RateDtoV1'
        id:
          type: string
          description: Represents workspace identifier across the system.
        imageUrl:
          type: string
          description: Represents an image url.
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipDtoV1'
        name:
          type: string
          description: Represents workspace name.
        subdomain:
          $ref: '#/components/schemas/WorkspaceSubdomainDtoV1'
        workspaceSettings:
          $ref: '#/components/schemas/WorkspaceSettingsDtoV1'
      additionalProperties: true
    RateDtoV1:
      type: object
      description: Represents hourly rate object.
      properties:
        amount:
          type: integer
          format: int32
          description: Represents an amount as integer.
        currency:
          type: string
          description: Represents a currency.
      additionalProperties: true
    CurrencyWithDefaultInfoDtoV1:
      type: object
      description: Represents currency with default info object.
      properties:
        code:
          type: string
          description: Represents currency code.
        id:
          type: string
          description: Represents currency identifier across the system.
        isDefault:
          type: boolean
          default: false
          description: Indicates whether currency should be set as default.
      additionalProperties: true
    Feature:
      type: string
      enum:
      - ADD_TIME_FOR_OTHERS
      - ADMIN_PANEL
      - ALERTS
      - APPROVAL
      - AUDIT_LOG
      - AUTOMATIC_LOCK
      - BRANDED_REPORTS
      - BULK_EDIT
      - CUSTOM_FIELDS
      - CUSTOM_REPORTING
      - CUSTOM_SUBDOMAIN
      - CREATION_PERMISSIONS
      - DECIMAL_FORMAT
      - DISABLE_MANUAL_MODE
      - EDIT_MEMBER_PROFILE
      - EXCLUDE_NON_BILLABLE_FROM_ESTIMATE
      - EXPENSES
      - FILE_IMPORT
      - TIMESHEET_IMPORT
      - USER_IMPORT
      - HIDE_PAGES
      - HISTORIC_RATES
      - INVOICING
      - INVOICE_EMAILS
      - INVOICE_REMINDERS
      - LABOR_COST
      - LOCATIONS
      - MANAGER_ROLE
      - MULTI_FACTOR_AUTHENTICATION
      - PROJECT_BUDGET
      - PROJECT_TEMPLATES
      - GRANT_PROJECT_MANAGER_ROLE
      - PRIVATE_PROJECT_ACCESS
      - QUICKBOOKS_INTEGRATION
      - RECURRING_ESTIMATES
      - RECURRING_INVOICES
      - REQUIRED_FIELDS
      - SCHEDULED_REPORTS
      - SCHEDULING
      - SCREENSHOTS
      - SSO
      - SUMMARY_ESTIMATE
      - TARGETS_AND_REMINDERS
      - TASK_RATES
      - TIME_OFF
      - UNLIMITED_REPORTS
      - USER_CUSTOM_FIELDS
      - WHO_CAN_CHANGE_TIMEENTRY_BILLABILITY
      - BREAKS
      - KIOSK_SESSION_DURATION
      - KIOSK_PIN_REQUIRED
      - WHO_CAN_SEE_ALL_TIME_ENTRIES
      - WHO_CAN_SEE_PROJECT_STATUS
      - WHO_CAN_SEE_PUBLIC_PROJECTS_ENTRIES
      - WHO_CAN_SEE_TEAMS_DASHBOARD
      - WORKSPACE_LOCK_TIMEENTRIES
      - WORKSPACE_TIME_AUDIT
      - WORKSPACE_TIME_ROUNDING
      - KIOSK
      - KIOSK_SIX_DIGIT_PIN
      - KIOSK_QR_CODE
      - LIMITED_USERS
      - FORECASTING
      - TIME_TRACKING
      - ATTENDANCE_REPORT
      - WORKSPACE_TRANSFER
      - FAVORITE_ENTRIES
      - SPLIT_TIME_ENTRY
      - CLIENT_CURRENCY
      - SCHEDULING_FORECASTING
      - SCIM
      - UNLIMITED_USER_SEATS
      - BILLABLE_HOURS
      - PROJECT_ESTIMATE
      - CSV_EXPORT
      - XLSX_EXPORT
      - ONE_MONTH_RANGE_REPORTS
      - ONE_YEAR_RANGE_REPORTS
      - SHARED_REPORTS
      description: Workspace feature identifier.
    MembershipDtoV1:
      type: object
      description: Represents a membership object.
      properties:
        costRate:
          $ref: '#/components/schemas/RateDtoV1'
        hourlyRate:
          $ref: '#/components/schemas/RateDtoV1'
        membershipStatus:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DECLINED
          - INACTIVE
          - ALL
          description: Represents a membership status enum.
        membershipType:
          type: string
          enum:
          - WORKSPACE
          - PROJECT
          - USERGROUP
          description: Represents membership type enum.
        targetId:
          type: string
          description: Represents target identifier across the system.
        userId:
          type: string
          description: Represents user identifier across the system.
      additionalProperties: true
    WorkspaceSubdomainDtoV1:
      type: object
      description: Represents the workspace subdomain.
      properties:
        enabled:
          type: boolean
          default: false
          description: Indicates whether subdomain is enabled on workspace.
        name:
          type: string
          description: Represents subdomain name.
      additionalProperties: true
    AutomaticLockDtoV1:
      type: object
      description: Represents an automatic lock object.
      properties:
        changeDay:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
