        schema:
          type: string
        example: 63034cd0cb0fb876a57e93ad
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Time Off Policies
      operationId: changeTimeOffPolicyStatus
      summary: Change a policy status
      security:
      - ApiKeyAuth: []
      - AddonKeyAuth: []
      parameters:
