openapi: 3.0.3
info:
  title: Clockify Time Off Policies API
  version: 1.0.0
  description: OpenAPI definition generated from POLICIESDOC.md. It covers time off policy list, create, get, delete, status
    change, and update operations described in the source Markdown.
servers:
- url: https://api.clockify.me/api
  description: Clockify API
tags:
- name: Time Off Policies
  description: Time off policy management operations.
paths:
  /v1/workspaces/{workspaceId}/time-off/policies:
    get:
      tags:
      - Time Off Policies
      operationId: getTimeOffPolicies
      summary: Get policies on a workspace
      security:
      - ApiKeyAuth: []
      - AddonKeyAuth: []
      parameters:
      - name: workspaceId
        in: path
        required: true
        description: Represents a workspace identifier across the system.
        schema:
          type: string
        example: 60f91b3ffdaf031696ec61a8
      - name: page
        in: query
        required: false
        description: Page number.
        schema:
          type: string
          maxLength: 1000
      - name: page-size
        in: query
        required: false
        description: Page size.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          default: 50
        example: 50
      - name: name
        in: query
        required: false
        description: Filters policies to names that contain the provided string.
        schema:
          type: string
        example: Holidays
      - name: status
        in: query
        required: false
        description: Filters policies by status.
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - ALL
        example: ACTIVE
      - name: sort-column
        in: query
        required: false
        description: Column to use for sorting policies.
        schema:
          type: string
          default: DEFAULT_SORT
      - name: sort-order
        in: query
        required: false
        description: Sort order.
        schema:
          type: string
          enum:
          - ASCENDING
          - DESCENDING
          default: ASCENDING
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
              example:
              - allowHalfDay: false
                allowNegativeBalance: true
                approve:
                  requiresApproval: true
                  specificMembers: false
                  teamManagers: true
                  userIds:
                  - 5b715612b079875110791432
                archived: true
                automaticAccrual:
                  amount: 1.5
                  period: MONTH
                  timeUnit: DAYS
                automaticTimeEntryCreation:
                  defaultEntities:
                    projectId: 65b36d3c525e243c48f9150f
                    taskId: 65b36d46fa3df8607e42d21a
                  enabled: true
                everyoneIncludingNew: false
                id: 5b715612b079875110791111
                name: Days
                negativeBalance:
                  amount: 3
                  period: YEAR
                  shouldReset: true
                  timeUnit: DAYS
                projectId: 65b36d3c525e243c48f9150f
                timeUnit: DAYS
                userGroupIds:
                - 5b715612b079875110791342
                - 5b715612b079875110791324
                - 5b715612b079875110793142
                userIds:
                - 5b715612b079875110791432
                - 5b715612b079875110791234
                workspaceId: 5b715612b079875110792222
    post:
      tags:
      - Time Off Policies
      operationId: createTimeOffPolicy
      summary: Create a time off policy
      security:
      - ApiKeyAuth: []
      - AddonKeyAuth: []
      parameters:
      - name: workspaceId
        in: path
        required: true
        description: Represents a workspace identifier across the system.
        schema:
          type: string
        example: 60f91b3ffdaf031696ec61a8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeOffPolicyRequest'
            example:
              allowHalfDay: false
              allowNegativeBalance: true
              approve:
                requiresApproval: true
                specificMembers: false
                teamManagers: true
                userIds:
                - 5b715612b079875110791432
              archived: true
              automaticAccrual:
                amount: 1.5
                period: MONTH
                timeUnit: DAYS
              automaticTimeEntryCreation:
                defaultEntities:
                  projectId: 65b36d3c525e243c48f9150f
                  taskId: 65b36d46fa3df8607e42d21a
                enabled: true
              color: '#8BC34A'
              everyoneIncludingNew: false
              hasExpiration: false
              icon: UMBRELLA
              name: Mental health days
              negativeBalance:
                amount: 3
                amountValidForTimeUnit: true
                period: YEAR
                shouldReset: true
                timeUnit: DAYS
              timeUnit: DAYS
              userGroups:
                contains: CONTAINS
                ids:
                - 5b715612b079875110791342
                status: ACTIVE
              users:
                contains: CONTAINS
                ids:
                - 5b715612b079875110791432
                status: ACTIVE
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
              example:
                allowHalfDay: false
                allowNegativeBalance: true
                approve:
                  requiresApproval: true
                  specificMembers: false
                  teamManagers: true
                  userIds:
                  - 5b715612b079875110791432
                archived: true
                automaticAccrual:
                  amount: 1.5
                  period: MONTH
                  timeUnit: DAYS
                automaticTimeEntryCreation:
                  defaultEntities:
                    projectId: 65b36d3c525e243c48f9150f
                    taskId: 65b36d46fa3df8607e42d21a
                  enabled: true
                everyoneIncludingNew: false
                id: 5b715612b079875110791111
                name: Days
                negativeBalance:
                  amount: 3
                  period: YEAR
                  shouldReset: true
                  timeUnit: DAYS
                projectId: 65b36d3c525e243c48f9150f
                timeUnit: DAYS
                userGroupIds:
                - 5b715612b079875110791342
                - 5b715612b079875110791324
                - 5b715612b079875110793142
                userIds:
                - 5b715612b079875110791432
                - 5b715612b079875110791234
                workspaceId: 5b715612b079875110792222
