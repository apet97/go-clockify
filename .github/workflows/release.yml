name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual retry path. The on-tag-push trigger above cannot be re-fired
  # without forbidden tag movement once a tag exists, so workflow_dispatch
  # is the supported way to re-run this workflow against an already-cut
  # tag (e.g. when the first run failed mid-publish). The dispatch path
  # checks out the requested tag, validates its existence, and pins
  # GoReleaser to it. Tag deletion / retag / force-push are NOT used.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release (e.g. v1.2.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # On tag push: github.ref is refs/tags/<tag>, so checking out
          # the default ref is the tag itself.
          # On workflow_dispatch: check out the requested tag explicitly
          # so the build context matches the release artefact target.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve and validate release tag
        id: resolve-release-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Pinning rationale:
          #   v1.2.1 and v1.2.1-rc.3 (and any future final/rc pair) can
          #   point to the same commit because the final tag is cut from
          #   the rc.3 peeled commit. GoReleaser's auto tag-detection
          #   (git describe / closest tag) is ambiguous in that case and
          #   has been observed to pick the rc tag while the release is
          #   intended for the final tag — see run 25635476567 where
          #   `tag=v1.2.1-rc.3` was logged during a v1.2.1 push, every
          #   asset upload hit 422 already_exists against the existing
          #   rc.3 release, and the v1.2.1 GitHub Release was never
          #   created. Pinning GORELEASER_CURRENT_TAG and the npm /
          #   downstream-dispatch RELEASE_VERSION env vars to this
          #   resolved tag closes that ambiguity. Existing tags must NOT
          #   be deleted, moved, or recreated to fix this; the workflow
          #   itself is the right place to remove the ambiguity.
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            release_tag="${INPUT_TAG}"
          else
            release_tag="${REF_NAME}"
          fi
          echo "Resolved release tag: ${release_tag}"
          # Shape guard. GoReleaser config and downstream verifiers
          # expect a v-prefixed semver tag (with optional -rc.N or
          # similar prerelease suffix).
          case "${release_tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            v[0-9]*.[0-9]*.[0-9]*-*) ;;
            *)
              echo "::error::release tag ${release_tag} does not match expected vMAJOR.MINOR.PATCH[-suffix] shape"
              exit 1
              ;;
          esac
          # Make sure the local tag database has the requested tag. On
          # workflow_dispatch the checkout above already checked out the
          # ref by name, but actions/checkout@v6 with fetch-depth: 0 will
          # not always re-fetch tag annotations after the dispatch ref is
          # resolved; re-fetch explicitly so the rev-parse below is
          # authoritative.
          git fetch --force --tags origin
          if ! git rev-parse "${release_tag}" >/dev/null 2>&1; then
            echo "::error::release tag ${release_tag} does not exist on origin"
            exit 1
          fi
          release_commit="$(git rev-parse "${release_tag}^{commit}")"
          echo "Resolved peeled commit: ${release_commit}"
          # Pinned-commit guard for the v1.2.1 community/self-hosted cut.
          # rc.3 peeled to ce56414ae012c4a49d21ae0a319b178619c5966a, and
          # the launch-readiness ledger records v1.2.1 as cut from that
          # exact commit. A mismatch here would mean either the tag was
          # rewritten (forbidden) or the workflow is targeting a
          # different revision than the published evidence — fail closed.
          if [ "${release_tag}" = "v1.2.1" ] && [ "${release_commit}" != "ce56414ae012c4a49d21ae0a319b178619c5966a" ]; then
            echo "::error::v1.2.1 must peel to ce56414ae012c4a49d21ae0a319b178619c5966a (per docs/launch-readiness-review-may-8.md), got ${release_commit}"
            exit 1
          fi
          echo "Tags pointing at HEAD (audit context):"
          git tag --points-at HEAD || true
          {
            echo "release_tag=${release_tag}"
            echo "release_commit=${release_commit}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.10"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.3"
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit pin — see "Resolve and validate release tag" step
          # rationale. Stops GoReleaser from picking the rc.3 sibling
          # tag when both tags peel to the same commit.
          GORELEASER_CURRENT_TAG: ${{ steps.resolve-release-tag.outputs.release_tag }}
      - name: Verify release asset count
        # Structural gate against the v0.7.0 class of bug (goreleaser
        # filter silently drops a whole artifact category). Fails the
        # workflow before staging/attestation/npm if dist/ doesn't
        # contain exactly the 46 files .goreleaser.yaml is contracted
        # to produce (15 binaries + 15 SBOMs + 15 sigstore bundles +
        # SHA256SUMS.txt). No untrusted input; calls an in-repo script
        # with no arguments (it defaults to ./dist).
        # See docs/runbooks/release-asset-count.md for triage.
        run: bash scripts/check-release-assets.sh
      - name: Stage release binaries for attestation
        run: |
          set -euo pipefail
          mkdir -p staging
          cp dist/clockify-mcp_darwin_arm64_v8.0/clockify-mcp staging/clockify-mcp-darwin-arm64
          cp dist/clockify-mcp_darwin_amd64_v1/clockify-mcp    staging/clockify-mcp-darwin-x64
          cp dist/clockify-mcp_linux_amd64_v1/clockify-mcp     staging/clockify-mcp-linux-x64
          cp dist/clockify-mcp_linux_arm64_v8.0/clockify-mcp   staging/clockify-mcp-linux-arm64
          cp dist/clockify-mcp_windows_amd64_v1/clockify-mcp.exe staging/clockify-mcp-windows-x64.exe
          # Postgres-tagged hosted-deploy binaries. Linux-only matrix —
          # see the clockify-mcp-postgres build block in .goreleaser.yaml.
          cp dist/clockify-mcp-postgres_linux_amd64_v1/clockify-mcp-postgres staging/clockify-mcp-postgres-linux-x64
          cp dist/clockify-mcp-postgres_linux_arm64_v8.0/clockify-mcp-postgres staging/clockify-mcp-postgres-linux-arm64
          # gRPC-tagged private-network artifacts (linux-only). The hosted
          # launch checklist links to clockify-mcp-grpc-postgres-* for HA
          # private-network gRPC; the no-postgres -grpc binary covers
          # single-process private-network gRPC. Both ship through the
          # mandatory cosign/SBOM chain, plus SLSA provenance when GitHub
          # artifact attestations are available, so operators are not forced
          # to self-build.
          cp dist/clockify-mcp-grpc_linux_amd64_v1/clockify-mcp-grpc   staging/clockify-mcp-grpc-linux-x64
          cp dist/clockify-mcp-grpc_linux_arm64_v8.0/clockify-mcp-grpc staging/clockify-mcp-grpc-linux-arm64
          cp dist/clockify-mcp-grpc-postgres_linux_amd64_v1/clockify-mcp-grpc-postgres   staging/clockify-mcp-grpc-postgres-linux-x64
          cp dist/clockify-mcp-grpc-postgres_linux_arm64_v8.0/clockify-mcp-grpc-postgres staging/clockify-mcp-grpc-postgres-linux-arm64
          # FIPS-tagged binaries. v1.1.0 verification surfaced a real
          # gap: the FIPS row had been added to GoReleaser without
          # extending this staging step, so every published FIPS
          # binary back to v1.0.x ships cosign-signed but with NO SLSA
          # build provenance (gh attestation verify returns HTTP 404).
          # Operators running the FIPS binary cannot prove it was
          # built by this workflow. Stage them here so the next
          # release closes the gap.
          cp dist/clockify-mcp-fips_darwin_arm64_v8.0/clockify-mcp-fips staging/clockify-mcp-fips-darwin-arm64
          cp dist/clockify-mcp-fips_darwin_amd64_v1/clockify-mcp-fips   staging/clockify-mcp-fips-darwin-x64
          cp dist/clockify-mcp-fips_linux_amd64_v1/clockify-mcp-fips    staging/clockify-mcp-fips-linux-x64
          cp dist/clockify-mcp-fips_linux_arm64_v8.0/clockify-mcp-fips  staging/clockify-mcp-fips-linux-arm64
      - name: Generate SLSA build provenance attestation
        # GitHub artifact attestations are feature-gated for this
        # user-owned private repository. Keep this best-effort at the
        # current account tier; release-smoke verifies the attestation
        # when present and narrowly skips only the known platform
        # "feature not available" response. Cosign signatures and
        # release asset checks remain mandatory.
        continue-on-error: true
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            staging/clockify-mcp-darwin-arm64
            staging/clockify-mcp-darwin-x64
            staging/clockify-mcp-linux-x64
            staging/clockify-mcp-linux-arm64
            staging/clockify-mcp-windows-x64.exe
            staging/clockify-mcp-postgres-linux-x64
            staging/clockify-mcp-postgres-linux-arm64
            staging/clockify-mcp-grpc-linux-x64
            staging/clockify-mcp-grpc-linux-arm64
            staging/clockify-mcp-grpc-postgres-linux-x64
            staging/clockify-mcp-grpc-postgres-linux-arm64
            staging/clockify-mcp-fips-darwin-arm64
            staging/clockify-mcp-fips-darwin-x64
            staging/clockify-mcp-fips-linux-x64
            staging/clockify-mcp-fips-linux-arm64
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Pinned to the resolved release tag (see resolve-release-tag
          # step) instead of github.ref_name so workflow_dispatch retries
          # land on the right tag, and so a final-vs-rc tag pair pointing
          # at the same commit cannot make npm publish a misnamed tarball.
          RELEASE_VERSION: ${{ steps.resolve-release-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not set — skipping npm publish."
            echo "To enable npm distribution: set NPM_TOKEN in repo secrets"
            echo "with an automation token scoped to @apet97 (see W2-13 notes)."
            exit 0
          fi
          ./scripts/publish-npm.sh "$RELEASE_VERSION"
      - name: Trigger reproducibility verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned — see resolve-release-tag rationale.
          RELEASE_VERSION: ${{ steps.resolve-release-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          # GoReleaser creates the GH release via GITHUB_TOKEN, which
          # suppresses the `release: [published]` event per GitHub's
          # infinite-loop-prevention rules. Fire the reproducibility
          # workflow explicitly via workflow_dispatch (which IS allowed
          # with GITHUB_TOKEN) to close the gap.
          echo "Dispatching reproducibility.yml for tag ${RELEASE_VERSION}"
          gh workflow run reproducibility.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${RELEASE_VERSION}" \
            -f tag="${RELEASE_VERSION}"
          echo "Dispatched. Monitor: gh run list --workflow=reproducibility.yml"
      - name: Trigger release smoke verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned — see resolve-release-tag rationale.
          RELEASE_VERSION: ${{ steps.resolve-release-tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          # release-smoke.yml listens on `release: [published]` for
          # the same GITHUB_TOKEN-suppression reason as reproducibility:
          # the release is created by an action using GITHUB_TOKEN, so
          # the published event never reaches release-smoke. Observed
          # live for v1.2.1-rc.1 — Release ran, the GitHub Release
          # object was created, but release-smoke never auto-fired.
          # Dispatch it explicitly here using the workflow_dispatch
          # trigger that release-smoke.yml already supports. The
          # workflow file lives on `main`, so --ref must be `main`
          # (workflow_dispatch can only target a ref where the
          # workflow file exists); the `tag` input passes the rc
          # tag through to the verifier steps.
          echo "Dispatching release-smoke.yml for tag ${RELEASE_VERSION}"
          gh workflow run release-smoke.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f tag="${RELEASE_VERSION}"
          echo "Dispatched. Monitor: gh run list --workflow=release-smoke.yml"
