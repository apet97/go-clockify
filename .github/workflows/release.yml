name: Release

# Builds the clockify-mcp binary matrix, packages the npm stdio launcher with
# those binaries under vendor/, and publishes the artifacts to the GitHub Release
# when a v* tag is pushed. The tagged commit has already been verified by the
# CI workflow should already be green before tagging; the release workflow still
# repeats the fast deterministic preflight so a tag cannot publish an untested
# binary/npm launcher pair.
#
# Injection-safe: the only ${{ }} expansions (github.ref_name, github.token)
# are bound through env: and used as quoted shell variables, never expanded
# directly inside a run: script.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Go release preflight
        run: go test -count=1 ./internal/mcp ./internal/tools ./internal/config ./internal/clockify ./cmd/clockify-mcp
      - name: npm launcher preflight
        working-directory: npm/clockify-mcp-launcher
        run: |
          npm ci
          npm test
          npm run build
      - name: Cross-compile clockify-mcp
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/clockify-mcp_${VERSION}_${os}_${arch}${ext}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/clockify-mcp
            echo "built $out"
          done
      - name: Package npm launcher with vendored binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_dir="npm/clockify-mcp-launcher"
          vendor_dir="${package_dir}/vendor"
          mkdir -p "$vendor_dir"

          cp "dist/clockify-mcp_${VERSION}_darwin_arm64" "$vendor_dir/clockify-mcp_darwin_arm64"
          cp "dist/clockify-mcp_${VERSION}_darwin_amd64" "$vendor_dir/clockify-mcp_darwin_amd64"
          cp "dist/clockify-mcp_${VERSION}_linux_amd64" "$vendor_dir/clockify-mcp_linux_amd64"
          cp "dist/clockify-mcp_${VERSION}_linux_arm64" "$vendor_dir/clockify-mcp_linux_arm64"
          cp "dist/clockify-mcp_${VERSION}_windows_amd64.exe" "$vendor_dir/clockify-mcp_windows_amd64.exe"

          cd "$package_dir"
          npm ci
          npm version --no-git-tag-version "${VERSION#v}"
          npm test
          npm run build
          node bin/clockify-mcp.js --version
          node -e "const p=require('./package.json'); if (p.version === '0.0.0') { console.error('release package version was not rewritten'); process.exit(1); }"
          pack_json="$GITHUB_WORKSPACE/dist/npm-pack.json"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist" --json > "$pack_json"
          tarball="$(node -e "const fs=require('fs'); const pack=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(pack[0].filename)" "$pack_json")"
          for binary in \
            clockify-mcp_darwin_arm64 \
            clockify-mcp_darwin_amd64 \
            clockify-mcp_linux_amd64 \
            clockify-mcp_linux_arm64 \
            clockify-mcp_windows_amd64.exe
          do
            tar -tzf "$GITHUB_WORKSPACE/dist/$tarball" | grep -qx "package/vendor/$binary"
          done
      - name: Generate release checksums
        run: |
          (cd dist && sha256sum clockify-mcp_* apet97-clockify-mcp-*.tgz > SHA256SUMS)
      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" dist/* --clobber
