name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JSON-RPC parse
            package: ./internal/mcp
            target: FuzzJSONRPCParse
          - name: schema tightening
            package: ./internal/tools
            target: FuzzTightenInputSchema
          - name: raw path normalization
            package: ./internal/tools
            target: FuzzSafeRawPath
          - name: error translation
            package: ./internal/clockify
            target: FuzzTranslateAPIError
          - name: ID validation
            package: ./internal/resolve
            target: FuzzValidateID
          - name: datetime parsing
            package: ./internal/timeparse
            target: FuzzParseDatetime
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.12"
      - name: Run fuzz target
        run: go test -run '^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s ${{ matrix.package }}
