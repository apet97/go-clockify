name: nightly-live

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  perfect-live:
    name: Perfect live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOCKIFY_API_KEY: ${{ secrets.CLOCKIFY_API_KEY }}
      CLOCKIFY_WORKSPACE_ID: ${{ secrets.CLOCKIFY_WORKSPACE_ID }}
      CLOCKIFY_RUN_LIVE_E2E: "1"
      CLOCKIFY_LIVE_PREFIX: "MCP-LIVE-CI-${{ github.run_id }}-"
      CLOCKIFY_LIVE_WORKSPACE_CONFIRM: ${{ secrets.CLOCKIFY_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.10"

      - name: Run perfect-live (attempt 1)
        id: run1
        continue-on-error: true
        run: |
          set -o pipefail
          make perfect-live 2>&1 | tee /tmp/run1.log

      - name: Retry perfect-live (attempt 2, only if attempt 1 failed)
        if: steps.run1.outcome == 'failure'
        id: run2
        continue-on-error: true
        run: |
          set -o pipefail
          make perfect-live 2>&1 | tee /tmp/run2.log

      - name: Decide overall outcome
        id: decide
        run: |
          if [ "${{ steps.run1.outcome }}" = "success" ] || [ "${{ steps.run2.outcome }}" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup live data (always)
        if: always()
        env:
          CLOCKIFY_LIVE_PREFIX: "MCP-LIVE-CI-"
        run: make live-clean-prefix

      - name: Open or update drift issue on failure
        if: always() && steps.decide.outputs.result == 'fail'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          script: |
            const fs = require('fs');
            const title = 'Nightly live drift';
            const label = 'drift';
            const runUrl = process.env.RUN_URL;

            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'b60205',
                  description: 'Nightly live Clockify drift signal',
                });
              }
            }

            function capturedTail() {
              for (const path of ['/tmp/run2.log', '/tmp/run1.log']) {
                try {
                  const log = fs.readFileSync(path, 'utf8');
                  return log.split('\n').slice(-80).join('\n');
                } catch (error) {
                  if (error.code !== 'ENOENT') {
                    throw error;
                  }
                }
              }
              return '(no captured log)';
            }

            await ensureLabel();
            let tail = capturedTail();
            tail = tail.replace(/[A-Za-z0-9_-]{20,}/g, '[REDACTED]');
            tail = tail.slice(-12000);

            const body = `Nightly live run failed.\n\nRun: ${runUrl}\n\nTail (last 80 lines, redacted):\n\n\`\`\`text\n${tail}\n\`\`\``;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 50,
            });
            const open = existing.data.find(issue => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Close drift issue on success
        if: steps.decide.outputs.result == 'pass'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          script: |
            const title = 'Nightly live drift';
            const label = 'drift';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 50,
            });
            const open = existing.data.find(issue => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Nightly live run passed. Auto-closing.\n\nRun: ${process.env.RUN_URL}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                state: 'closed',
              });
            }

      - name: Fail workflow if drift detected
        if: always() && steps.decide.outputs.result == 'fail'
        run: exit 1
