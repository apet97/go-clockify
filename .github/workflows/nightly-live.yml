name: nightly-live

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live
  cancel-in-progress: false

jobs:
  perfect-live:
    name: Perfect live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOCKIFY_API_KEY: ${{ secrets.CLOCKIFY_LIVE_API_KEY }}
      CLOCKIFY_WORKSPACE_ID: ${{ secrets.CLOCKIFY_LIVE_WORKSPACE_ID }}
      CLOCKIFY_RUN_LIVE_E2E: "1"
      CLOCKIFY_LIVE_PREFIX: "MCP-LIVE-CI-${{ github.run_id }}-"
      CLOCKIFY_LIVE_WORKSPACE_CONFIRM: ${{ secrets.CLOCKIFY_LIVE_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.12"

      - name: Run perfect-live (attempt 1)
        id: run1
        continue-on-error: true
        run: |
          set -o pipefail
          make perfect-live 2>&1 | tee /tmp/run1.log

      - name: Retry perfect-live (attempt 2, only if attempt 1 failed)
        if: steps.run1.outcome == 'failure'
        id: run2
        continue-on-error: true
        run: |
          set -o pipefail
          make perfect-live 2>&1 | tee /tmp/run2.log

      - name: Decide overall outcome
        id: decide
        run: |
          if [ "${{ steps.run1.outcome }}" = "success" ] || [ "${{ steps.run2.outcome }}" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup live data (always)
        if: always()
        env:
          CLOCKIFY_LIVE_PREFIX: "MCP-LIVE-CI-"
        run: make live-clean-prefix

      - name: Open or update drift issue on failure
        if: always() && steps.decide.outputs.result == 'fail'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          script: |
            const fs = require('fs');
            const title = 'Nightly live drift';
            const label = 'drift';
            const classificationLabels = {
              'env/config drift': {
                name: 'drift:env-config',
                color: 'fbca04',
                description: 'Nightly live failed before Clockify calls because env, secrets, or gates are missing',
              },
              'Clockify API drift': {
                name: 'drift:clockify-api',
                color: 'd93f0b',
                description: 'Nightly live reached Clockify and observed API or plan behavior drift',
              },
              'code regression': {
                name: 'drift:code-regression',
                color: 'b60205',
                description: 'Nightly live points at a repository code regression',
              },
              'untriaged': {
                name: 'drift:untriaged',
                color: '5319e7',
                description: 'Nightly live drift needs human triage',
              },
            };
            const runUrl = process.env.RUN_URL;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description,
                });
              }
            }

            function capturedTail() {
              for (const path of ['/tmp/run2.log', '/tmp/run1.log']) {
                try {
                  const log = fs.readFileSync(path, 'utf8');
                  return log.split('\n').slice(-80).join('\n');
                } catch (error) {
                  if (error.code !== 'ENOENT') {
                    throw error;
                  }
                }
              }
              return '(no captured log)';
            }

            function classify(log) {
              if (/live-contract-local: set|live-clean-prefix: set|required environment|CLOCKIFY_RUN_LIVE_E2E/.test(log)) {
                return {
                  key: 'env/config drift',
                  why: 'The run stopped at a local environment or gate check before live Clockify assertions.',
                };
              }
              if (/panic:|DATA RACE|FAIL:|--- FAIL:|compile|build failed|undefined:|no required module/.test(log)) {
                return {
                  key: 'code regression',
                  why: 'The failure shape points at local code, build, or test behavior.',
                };
              }
              if (/feature_unavailable|subscription|plan|Clockify API|HTTP status|status code|429|401|403|404|405|5\d\d/.test(log)) {
                return {
                  key: 'Clockify API drift',
                  why: 'The run reached Clockify-facing behavior or an upstream/plan/permission boundary.',
                };
              }
              return {
                key: 'untriaged',
                why: 'The workflow could not classify the captured tail automatically.',
              };
            }

            await ensureLabel(label, 'b60205', 'Nightly live Clockify drift signal');
            let rawTail = capturedTail();
            const classification = classify(rawTail);
            const classLabel = classificationLabels[classification.key];
            await ensureLabel(classLabel.name, classLabel.color, classLabel.description);
            let tail = rawTail.replace(/[A-Za-z0-9_-]{20,}/g, '[REDACTED]');
            tail = tail.slice(-12000);

            const body = `Nightly live run failed.\n\nClassification: ${classification.key}\nReason: ${classification.why}\n\nRun: ${runUrl}\n\nTail (last 80 lines, redacted):\n\n\`\`\`text\n${tail}\n\`\`\``;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 50,
            });
            const open = existing.data.find(issue => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                labels: [label, classLabel.name],
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, classLabel.name],
              });
            }

      - name: Close drift issue on success
        if: steps.decide.outputs.result == 'pass'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          script: |
            const title = 'Nightly live drift';
            const label = 'drift';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 50,
            });
            const open = existing.data.find(issue => issue.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Nightly live run passed. Auto-closing.\n\nRun: ${process.env.RUN_URL}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                state: 'closed',
              });
            }

      - name: Fail workflow if drift detected
        if: always() && steps.decide.outputs.result == 'fail'
        run: exit 1
