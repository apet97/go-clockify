name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.5.0
      - name: Check test-fragility budget
        run: make lint-test-fragility

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - name: Run govulncheck
        run: |
          (cd tools/govulncheck && GOWORK=off go install golang.org/x/vuln/cmd/govulncheck)
          govulncheck -version
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - name: Build clockify-mcp
        run: go build -o /tmp/clockify-mcp ./cmd/clockify-mcp
      - name: Verify default build has no platform symbols
        run: |
          set -e
          for pat in opentelemetry 'net/http/pprof' 'google.golang.org/grpc' 'jackc/pgx'; do
            count=$(go tool nm /tmp/clockify-mcp | grep -c "$pat" || true)
            printf '%s symbol count: %s\n' "$pat" "$count"
            if [ "$count" -ne 0 ]; then
              echo "FAIL: default build leaked $pat symbols" >&2
              exit 1
            fi
          done
      - name: Verify go.mod has no platform rows
        run: |
          set -e
          for pat in 'go.opentelemetry.io' 'google.golang.org/grpc' 'jackc/pgx'; do
            count=$(grep -c "$pat" go.mod || true)
            printf '%s rows: %s\n' "$pat" "$count"
            if [ "$count" -ne 0 ]; then
              echo "FAIL: go.mod leaked $pat rows" >&2
              exit 1
            fi
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - run: go test -race -count=1 -timeout 120s ./...

  smoke-stdio:
    name: Stdio smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - name: Build and exercise initialize + tools/list
        env:
          CLOCKIFY_API_KEY: ci-test-key
          CLOCKIFY_WORKSPACE_ID: "00000000000000000000abcd"
        run: bash scripts/smoke-stdio.sh

  catalog-drift:
    name: Tool-catalog drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - name: Regenerate tool catalog
        run: go run ./scripts/gen-tool-catalog -out docs
      - name: Fail if generated catalog drifted
        run: |
          if ! git diff --exit-code docs/tool-catalog.json docs/tool-catalog.md; then
            echo "tool catalog drift detected; run 'go run ./scripts/gen-tool-catalog -out docs' and commit" >&2
            exit 1
          fi

  coverage-dashboard-drift:
    name: Coverage dashboard drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - run: make coverage-dashboard-drift

  api-parity-matrix-drift:
    name: API parity matrix drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check API parity matrix matches the catalog and ledger
        run: make api-parity-matrix-drift

  openapi-drift:
    name: OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@v1
        with:
          # Mirror the .ruby-version file (currently 3.3). actionlint's
          # bundled catalog doesn't yet know about ruby-version-file,
          # so we inline the value here and keep .ruby-version as the
          # source of truth for local rbenv/asdf.
          ruby-version: "3.3"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - name: openapi drift
        run: make openapi-drift

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run shellcheck on scripts/
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # v2.0.0
        with:
          severity: warning
          scandir: scripts

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          actionlint -color

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pinned gitleaks
        run: bash scripts/gitleaks-install.sh "$HOME/gitleaks-bin"
      - name: Run gitleaks
        run: |
          "$HOME/gitleaks-bin/gitleaks" detect \
            --no-git \
            --source . \
            --redact \
            --config .gitleaks.toml \
            --exit-code 1

  raw-allowlist-drift:
    name: Raw allowlist drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - run: make raw-allowlist-drift

  selfinspect-drift:
    name: Self-inspection drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: make selfinspect-drift

  mod-tidy-drift:
    name: Module tidy drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - run: make mod-tidy-drift
