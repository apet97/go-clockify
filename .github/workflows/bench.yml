name: Bench

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.12"
      - name: Validate committed benchmark baseline
        run: make bench-baseline-check
      - name: Run benchmark comparison
        run: |
          go test -bench=. -run '^$' -benchmem -count=10 \
            ./internal/clockify \
            ./internal/timeparse \
            ./internal/resolve \
            ./internal/tools \
            ./internal/mcp > /tmp/bench-raw.txt
          bash scripts/filter-bench-output.sh < /tmp/bench-raw.txt > /tmp/bench.txt
          go run golang.org/x/perf/cmd/benchstat@latest internal/benchdata/baseline.txt /tmp/bench.txt
