name: Bench

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.11"
      - name: Validate committed benchmark baseline
        run: make bench-baseline-check
      - name: Run benchmark comparison
        run: |
          go test -bench=. -run '^$' -benchmem -count=10 \
            ./internal/clockify \
            ./internal/timeparse \
            ./internal/resolve \
            ./internal/tools \
            ./internal/mcp > /tmp/bench-raw.txt
          bash scripts/filter-bench-output.sh < /tmp/bench-raw.txt > /tmp/bench.txt
          go run golang.org/x/perf/cmd/benchstat@latest internal/benchdata/baseline.txt /tmp/bench.txt
